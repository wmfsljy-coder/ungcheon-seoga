<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웅천 서가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --bark:#3A2A1E;--bark-2:#271B12;--paper:#FAF7F0;--paper-2:#F0E9D9;
  --ink:#2B2320;--muted:#7A6B5C;--gold:#B5891F;--gold-soft:rgba(181,137,31,.13);
  --red:#9E3B24;--red-soft:rgba(158,59,36,.10);--ok:#2F6B3A;--ok-soft:rgba(47,107,58,.12);
  --line:rgba(43,35,32,.15);--radius:3px;
  /* 제목·로고: 주아체 / 본문·화면: 프리텐다드 / 라벨·독후감 본문: 고운돋움 / 도장 한자: 고운바탕 */
  --serif:'Jua','Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  --soft:'Gowun Dodum','Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  --sans:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:var(--red)}
[hidden]{display:none!important}

.top{background:var(--bark);color:#F2E7D2;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-30px;top:-40px;width:220px;height:220px;
  background:radial-gradient(circle at 30% 70%,rgba(181,137,31,.22),transparent 62%);pointer-events:none}
.top-in{max-width:1000px;margin:0 auto;padding:16px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.emb{height:44px;width:auto;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.mark small.school{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;opacity:.72;margin:0 0 1px}
.mark{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:.01em;line-height:1.2}
.mark small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;letter-spacing:.09em;opacity:.6;margin-top:1px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.who button{padding:4px 12px;font-size:12.5px;color:#F2E7D2;border:1px solid rgba(242,231,210,.3);border-radius:999px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 90px}
.demo{background:var(--gold-soft);font-size:12.5px;text-align:center;padding:6px 12px;color:var(--ink)}

.board{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);margin-top:20px;padding:15px 17px 16px;position:relative;overflow:hidden}
.board-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.board-head h2{font-family:var(--serif);font-size:20px;font-weight:400;margin:0}
.board-head p{margin:0;font-size:13px;color:var(--muted)}
.board-head .count{margin-left:auto;font-family:var(--serif);font-size:15px}
.board-head .count b{font-size:24px;color:var(--red)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{height:74px;border:1px dashed var(--line);border-radius:2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--paper);position:relative;overflow:hidden}
.slot span{font-size:11px;color:var(--muted)}
.slot.on{border-style:solid;border-color:var(--red-soft)}
.seal{height:46px;transform:rotate(-7deg);margin-bottom:10px}
.slot .lb{position:absolute;bottom:4px;font-size:10px;color:var(--muted);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{margin-top:11px;padding:9px 12px;background:var(--gold-soft);border-radius:2px;font-size:13.5px}
.fresh{margin-top:16px}
.fresh h3{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 8px}
.fresh-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.fresh-row{grid-template-columns:1fr 1fr}.fresh-row .label:nth-child(n+3){display:none}}
@media (max-width:560px){.fresh-row{grid-template-columns:1fr}.fresh-row .label:nth-child(n+2){display:none}}

.tabs{display:flex;gap:2px;margin-top:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  position:sticky;top:0;z-index:20;background:var(--paper)}
.tabs::-webkit-scrollbar{display:none}
.tabs .s{display:none}
.tabs button{padding:10px 13px;font-size:14px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--gold)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.panel{padding-top:22px}
h3.sec{font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 4px}
h3.sec.gap{margin-top:34px}
p.sub{margin:0 0 16px;font-size:13.5px;color:var(--muted);max-width:68ch}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--bark);border-color:var(--bark);color:#F2E7D2}
.toggle{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.toggle input{accent-color:var(--red)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(228px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.bk{background:var(--paper);padding:14px 15px;display:flex;flex-direction:column;gap:5px}
.bk .tag{font-size:11.5px;color:var(--gold)}
.bk .tag b{font-weight:500;color:var(--red)}
.bk h4{font-family:var(--serif);font-size:17px;font-weight:400;margin:0;line-height:1.35}
.bk .by{font-size:12.5px;color:var(--muted);margin:-2px 0 0}
.bk .avail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:2px}
.st{display:inline-block;font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.out{background:var(--red-soft);color:var(--red)}
.st.none{background:var(--paper-2);color:var(--muted);font-weight:500}
.callno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.libsum{font-size:13px;color:var(--muted);margin:-8px 0 14px}
/* 서가 카드: 표지가 있으면 왼쪽에 */
.bk.has-cover{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 12px;align-content:start}
.bk.has-cover>.cov{grid-row:1 / span 6}
.bk .cov.ph{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 6px;color:#FFF3DE;text-align:center;box-sizing:border-box}
.bk .cov.ph em{font-style:normal;font-family:var(--serif);font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bk .cov.ph i{font-style:normal;font-size:9.5px;opacity:.85}
.bk .cov{width:62px;aspect-ratio:3/4.3;object-fit:cover;border-radius:2px;box-shadow:0 1px 3px rgba(43,35,32,.25);background:var(--paper-2);max-width:100%}
.bk.has-cover>*:not(.cov){grid-column:2}
.shelf-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.shelf-head h4{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
.shelf-head span{font-size:13px;color:var(--muted)}
/* 도서 검색 */
.sbar{display:flex;gap:8px;margin-bottom:14px}
.sbar input{flex:1}
.sres{display:grid;gap:10px}
.sitem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--paper)}
.sitem .cov{grid-row:1 / span 4;width:56px;aspect-ratio:3/4.3;object-fit:cover;border-radius:2px;background:var(--paper-2);max-width:100%}
.sitem h4{font-family:var(--serif);font-size:17px;font-weight:400;margin:0;line-height:1.35}
.sitem .by{font-size:12.5px;color:var(--muted);margin:0}
.sitem .row{gap:6px 12px}
/* 도장 종류별 */
.need{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.need span{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.need span.ok{border-color:transparent;color:#fff}
.need .nlab{border:0;background:none;padding:3px 0;color:var(--muted)}
.need .nmiss{border:0;background:none;color:#9E3B24;font-weight:600}
.need .nmiss.ok2{color:#2F6B3A}
.need .k-label.ok{background:#9E3B24}.need .k-review.ok{background:#2B4C7E}.need .k-quiz.ok{background:#2F6B3A}
/* 개인정보 안내 */
.consent{border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:12px 14px;font-size:13.5px;line-height:1.65;max-height:260px;overflow:auto;margin-bottom:12px}
.consent table{font-size:13px}
.consent th{white-space:nowrap;width:5.5em}
.agree{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink);margin:0 0 14px;cursor:pointer}
.agree input{margin-top:4px;width:18px;height:18px;accent-color:var(--red);flex:none}
/* 교사 안내 */
.todo{width:100%;margin:6px 0 4px}
.todo td:first-child{white-space:nowrap;color:var(--gold);font-weight:600;width:6.5em}
.howto dt{font-weight:600;margin-top:10px;font-size:14px}
.howto dd{margin:2px 0 0;font-size:14px;color:var(--ink)}
.pvbar{margin-top:14px;background:var(--bark);color:#F2E7D2;border-radius:var(--radius);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px}
.pvbar b{color:#F5D27A}
.pvbar input[type=text]{width:120px;padding:6px 9px;font-size:15px;background:#FAF7F0;color:#2B2320;border:0}
.pvbar button{color:#F2E7D2;border:1px solid rgba(242,231,210,.4);border-radius:999px;padding:5px 12px;font-size:13px}
.pvbar .end{margin-left:auto}
.bk blockquote{margin:3px 0 0;padding-left:10px;border-left:2px solid var(--gold-soft);font-size:12.5px;line-height:1.55}
.bk .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px;font-size:12.5px}
.bk .acts button,.bk .acts a{color:var(--red);border-bottom:1px solid currentColor;padding:0 0 1px;text-decoration:none;line-height:1.5}

.form{background:var(--paper-2);border:1px solid var(--line);padding:17px;border-radius:var(--radius)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
select,input[type=text],input[type=search],input[type=password],input[type=number],input[type=date],textarea{width:100%;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font-size:16px}
textarea{resize:vertical;min-height:92px;line-height:1.7}
.field{margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{flex:1;padding:8px;font-size:13.5px;color:var(--muted);background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--bark);color:#F2E7D2;font-weight:500}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.counter.over{color:var(--red)}
.btn{background:var(--red);color:#fff;padding:10px 20px;border-radius:2px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.two>*{min-width:0}
@media (max-width:780px){.two{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}

/* 라벨: 화면과 인쇄가 같은 비율(100 × 46.4) */
.label{background:#fff;color:#2B2320;border:1px solid rgba(43,35,32,.2);border-radius:2px;
  aspect-ratio:100/46.4;padding:4.2% 5%;display:flex;flex-direction:column;gap:3%;overflow:hidden;container-type:inline-size}
.label .lt{font-family:var(--serif);font-weight:400;color:#9E3B24;font-size:max(16px,4.8cqw);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .q{font-family:var(--soft);font-size:max(14px,3.9cqw);line-height:1.42;flex:1;overflow:hidden}
.label.short .q{font-size:max(15px,4.4cqw)}
.label .bt2{font-size:max(11px,2.7cqw);border-top:1px solid rgba(43,35,32,.18);padding-top:1.6%;display:flex;justify-content:space-between;gap:8px;color:#6B5C4E;white-space:nowrap}
.label .bt2 span{overflow:hidden;text-overflow:ellipsis}
.label .bt2 em{font-style:normal;color:#9E3B24}

.stack{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:2px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:9px}
.card .rv{font-size:14px;line-height:1.75;white-space:pre-wrap}
.card .rvh{font-family:var(--serif);font-size:17px;font-weight:400}
.card .rv{font-family:var(--soft)}
.card .rvb{font-size:12.5px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.gapline{height:1px;background:var(--line);margin:26px 0 20px}
.pill.theme{background:#E7F0E2;color:#3C5A32;border-color:#BBD3AF}
.evbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:linear-gradient(90deg,#FDECEA,#FFF3C9);border:2px solid #B0301E;border-radius:12px;padding:9px 14px;margin:0 0 14px;color:#8A1F12}
.evbar .x{font-family:Jua,sans-serif;font-size:20px;background:#B0301E;color:#fff;border-radius:10px;padding:1px 9px}
.evbar b{font-family:var(--serif);font-weight:400;font-size:17px}
.evbar .ed{font-size:12.5px;background:#fff;border:1px solid #E9B4AA;border-radius:999px;padding:1px 8px}
.evbar .et{font-size:13.5px}
.themebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#EFF6EA;border:1px solid #CADFBE;border-radius:12px;padding:9px 14px;margin:0 0 14px;color:#33502A}
.themebar .tp{font-size:12px;background:#3C5A32;color:#fff;border-radius:999px;padding:2px 9px}
.themebar b{font-family:var(--serif);font-weight:400;font-size:17px}
.themebar .ta{font-size:12.5px;background:#fff;border:1px solid #CADFBE;border-radius:999px;padding:1px 8px}
.themebar .tb{font-size:13.5px;color:#4B6640}
.pill.grey{background:var(--paper-2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.vote-btn{align-self:flex-start;border:1px solid var(--red);color:var(--red);padding:5px 14px;border-radius:999px;font-size:12.5px}
.vote-btn:disabled{border-color:var(--line);color:var(--muted)}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank .n{font-family:var(--serif);font-size:21px;color:var(--gold);width:24px}
.rank .g{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}

.q-box{border:1px solid var(--line);padding:15px 17px;border-radius:2px;margin-bottom:12px;background:var(--paper)}
.q-box p.qt{margin:0 0 10px;font-size:14.5px}
.q-box .src{font-size:12px;color:var(--gold);margin:0 0 4px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer;color:var(--ink);margin:0}
.opt input{margin-top:5px;accent-color:var(--red)}
.fb{margin-top:9px;font-size:13px;padding:9px 12px;border-radius:2px;background:var(--paper-2)}
.fb.ok{background:var(--gold-soft)}

.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.scrollx th,.scrollx td{white-space:nowrap}
.scrollx td:nth-child(3){width:100%}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--gold)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bark-2);color:#F2E7D2;
  padding:11px 20px;border-radius:2px;font-size:13.5px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw}
.busy{position:fixed;inset:0 0 auto 0;height:3px;background:var(--gold);z-index:70;animation:busy 1.1s linear infinite;transform-origin:left}
@keyframes busy{0%{transform:scaleX(0)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
.guide{max-width:70ch}
.mbar .reset{margin-top:8px;font-size:13px;color:var(--muted)}
.mbar .reset.soon{color:#8A1F12;background:#FDECEA;border:1px solid #E8B4AC;border-radius:8px;padding:6px 10px}
.lookcard{border:2px solid #2F6B3A;border-radius:12px;padding:12px 14px;margin:0 0 14px;background:#F2F8F2}
.lookcard .big{font-size:18px;font-weight:700}
.lookcard .ok{color:#2F6B3A;font-weight:700}.lookcard .no{color:#8A1F12;font-weight:700}
.who .guide-red,.guide-red{background:#B0301E!important;color:#fff!important;border-color:#B0301E!important;font-weight:700;font-size:15px;padding:7px 14px}
.who .bell.nt{background:#FFF3C9;color:#6B4228;border-color:#E5C46B}
.guidebanner{display:flex;align-items:center;gap:10px;background:#FDECEA;border:2px solid #B0301E;border-radius:12px;padding:10px 14px;margin:0 0 14px;color:#8A1F12}
.guidebanner b{font-size:16px}.guidebanner .btn{margin-left:auto;background:#B0301E;border-color:#B0301E;color:#fff}
.sguide .red{color:#B0301E;font-weight:700}
.sguide .redbox{border:2px solid #B0301E;background:#FDECEA;border-radius:12px;padding:10px 14px;margin:6px 0 12px}
.sguide .redbox h4{color:#B0301E;font-size:19px;margin:0 0 6px}
.hall{background:linear-gradient(135deg,#FFF6D8,#FBE7B8);border:1px solid #E5C46B;border-radius:14px;padding:12px 14px;margin:0 0 18px}
.hall h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 6px}
.hall h3 span{font-family:inherit;font-size:13px;color:var(--muted);margin-left:6px}
.hmon{font-size:12.5px;color:#8A5A00;font-weight:700;margin:8px 0 4px}
.hrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hcard{flex:0 0 min(240px,70vw);text-align:left;background:#fff;border:1px solid #EBD9A8;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit}
.hcard b{font-family:var(--serif);font-weight:400;font-size:16px}
.hcard span{font-size:13px;color:var(--muted)}
.hcard em{font-style:normal;font-size:12.5px;color:#8A5A00}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolepick .btn{padding:18px 0;font-size:18px}
.stafftag.club{background:#2F6B3A;color:#fff}

.who .help{font-weight:600}
/* 별: 도장 5개마다 하나(누적) */
.starbadge{display:inline-flex;align-items:center;gap:3px;background:#F5D27A;color:#3A2A1E;border-radius:999px;padding:2px 9px 2px 7px;font-weight:700;font-size:13px}
.starbadge svg{width:15px;height:15px}
.stars{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:-4px 0 10px}
.stars svg{width:18px;height:18px}
.stars .sn{font-size:12.5px;color:var(--muted);margin-left:6px}
.stars .sx{font-family:var(--serif);font-size:15px;color:#9A7414;margin-left:2px}
.stars svg.pop{animation:starPop .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starPop{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.5) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
/* 오늘의 문장 */
.quote{position:relative;margin-top:18px;border-radius:14px;padding:16px 20px 14px 56px;background:linear-gradient(135deg,#FFF9EC,#F6EBD3);border:1px solid rgba(181,137,31,.3);overflow:hidden}
.quote::before{content:"“";position:absolute;left:14px;top:-6px;font:400 64px/1 'Gowun Batang',serif;color:rgba(158,59,36,.35)}
.quote .qk{font-size:12px;font-weight:600;letter-spacing:.06em;color:#9A7414}
.quote .qt{font-family:var(--soft);font-size:18px;line-height:1.6;margin:4px 0 6px;color:var(--ink);word-break:keep-all;text-wrap:balance}
.quote .qs{font-size:13px;color:var(--muted)}
body.role-staff .quote{background:#fff;border-color:var(--line);padding:12px 18px 10px 52px}
body.role-staff .quote .qt{font-size:16px}
body.role-staff .quote .qk{color:var(--gold)}
/* 친구들이 방금 쓴 글: 넓은 화면은 오른쪽 사이드바, 좁은 화면은 서가 탭 맨 위 카드 줄 */
.feed{display:none}
.feed h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 2px}
.feed .fsub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.fitem{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.fitem:hover{border-color:rgba(158,59,36,.35);background:#FFFDF8}
.fitem .fk{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fitem .fk b{font-weight:600;color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.fk .k-label{background:#9E3B24}.fk .k-review{background:#2B4C7E}
.fitem .ft{font-family:var(--serif);font-size:15px;line-height:1.35;color:#9E3B24;display:block}
.fitem .fx{font-family:var(--soft);font-size:13.5px;line-height:1.55;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.fitem .fm{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px}
.feed .more{width:100%;margin-top:4px}
@media (min-width:1100px){
  body:not(.role-staff) .wrap{max-width:1320px}
  body:not(.role-staff) .top-in{max-width:1320px}
  body:not(.role-staff) #app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0 28px;align-items:start}
  body:not(.role-staff) #app>*:not(.feed){grid-column:1}
  body:not(.role-staff) .feed{display:block;grid-column:2;grid-row:1 / span 8;position:sticky;top:14px;margin-top:18px;
    max-height:calc(100vh - 28px);overflow:auto;padding:14px 12px 10px;background:var(--paper-2);border-radius:14px}
  .feedstrip{display:none!important}
  .ntinline{display:none}
}
.notices{background:#FFF8E6;border:1px solid #E5C46B;border-radius:12px;padding:10px 12px;margin:0 0 16px}
.notices h3{font-family:var(--serif);font-weight:400;font-size:17px;margin:0 0 6px}
.notices ul{list-style:none;margin:0;padding:0}
.notices .ntc{padding:8px 0;border-top:1px dashed #E5C46B;display:flex;flex-direction:column;gap:3px;font-size:14px}
.notices .ntc:first-child{border-top:0;padding-top:2px}
.notices .ntc b{font-weight:700}
.notices .ntc.gift b{color:#8A5A00}
.notices .ntc em{font-style:normal;font-weight:600;color:#2F6B3A}
.notices .ntc small{color:var(--muted);font-size:12.5px}
.feedstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 0 16px;scrollbar-width:thin}
.feedstrip .fitem{flex:0 0 min(260px,78vw);margin:0;scroll-snap-align:start}
.stripH{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.stripH h4{font-family:var(--serif);font-weight:400;font-size:17px;margin:0}
/* 읽기 창 */
.reader{position:fixed;inset:0;z-index:80;background:rgba(30,22,16,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.reader .rbox{background:var(--paper);border-radius:16px;max-width:620px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:popin .25s ease both}
.reader .rtop{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.reader .rtop .x{margin-left:auto;font-size:22px;line-height:1;padding:4px 10px;border-radius:8px}
.reader .rtop .x:hover{background:var(--paper-2)}
.reader .rbody .card{border:0;padding:0;background:transparent}
.reader .rbody .rv{font-size:16px;line-height:1.9}
.reader .rnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.reader .rnav button,.reader .rnav .hint{white-space:nowrap}
.reader .rlike{display:flex;justify-content:center;margin-top:14px}
/* 게시판 */
.wallbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px}
.wallbar input{max-width:240px}
.wcard{cursor:pointer}
.wcard .rv{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
/* ── 교사 화면: 학생 화면과 영역이 다르게. 남색 관리 화면 + 넓은 화면에서는 왼쪽 세로 메뉴 ── */
body.role-staff{--paper:#F4F6F8;--paper-2:#E7ECF1;--ink:#1E2A36;--muted:#5B6B7B;--line:rgba(30,45,60,.15);
  --gold:#3A6EA5;--gold-soft:rgba(58,110,165,.12);--bark:#1F2E3D;--bark-2:#152029;--red:#B0452A;--red-soft:rgba(176,69,42,.1)}
body.role-staff .top{background:linear-gradient(90deg,#1F2E3D,#2A3F55)}
body.role-staff .top::after{background:radial-gradient(circle at 30% 70%,rgba(120,170,220,.18),transparent 62%)}
.who{flex-wrap:wrap;justify-content:flex-end}
.who>*{white-space:nowrap}
@media (max-width:560px){.who{margin-left:0;width:100%;justify-content:flex-start;gap:6px 8px}.who button{padding:5px 11px}}
.stafftag{font-size:11.5px;font-weight:700;letter-spacing:.08em;background:#F2E7D2;color:#1F2E3D;border-radius:4px;padding:2px 7px}
body.role-staff .board{background:#fff;border-color:var(--line)}
body.role-staff .news{background:#FFFBF0}
@media (min-width:1000px){
  body.role-staff .wrap{max-width:1200px}
  body.role-staff .top-in{max-width:1200px}
  body.role-staff #app{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 30px;align-items:start}
  body.role-staff #pvbar,body.role-staff #quote,body.role-staff #board{grid-column:1 / -1}
  body.role-staff .tabs{grid-column:1;flex-direction:column;gap:2px;border-bottom:0;border-right:1px solid var(--line);
    position:sticky;top:14px;margin-top:22px;padding:8px 10px 8px 0;overflow:visible;background:transparent}
  body.role-staff .tabs button{text-align:left;border-bottom:0;border-left:3px solid transparent;padding:10px 14px;margin:0;border-radius:0 8px 8px 0}
  body.role-staff .tabs button[aria-selected="true"]{border-left-color:var(--gold);background:var(--paper-2);color:var(--ink)}
  body.role-staff #panels{grid-column:2;padding-top:22px}
}
/* ── 학생: 이번 주 도장판(5칸) + 이번 달 막대(20칸) ── */
.bonus{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink);background:#FFF6DA;border-radius:10px;padding:7px 12px}
.bonus svg{width:26px;height:26px;flex:none}
.bonus b{font-family:var(--serif);font-weight:400;font-size:17px;color:#9A7414}
.mbar{margin-top:14px}
.mbar .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:6px}
.mbar .lab b{font-family:var(--serif);font-weight:400;font-size:19px}
.mbar .track{position:relative;display:grid;grid-template-columns:repeat(var(--cap),1fr);gap:3px}
.mbar .track i{height:12px;border-radius:3px;background:var(--line)}
.mbar .track i.on{background:linear-gradient(180deg,#C8742E,#9E3B24)}
.mbar .track i.gift{box-shadow:inset 0 0 0 2px #D9A93A}
.mbar .flag{font-size:11.5px;color:#9A7414;margin-top:4px}
.giftbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:linear-gradient(90deg,#FFF3C9,#FDE7B5);border:1px solid #E5C46B;
  border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.giftbar b{font-family:var(--serif);font-weight:400;font-size:18px}
.giftbar .end{margin-left:auto}
.giftbar>svg{width:30px;height:30px;flex:0 0 auto}
/* 상품권 표 */
.gtable td,.gtable th{white-space:nowrap}
.gtypes span{display:inline-block;width:20px;height:20px;border-radius:50%;color:#fff;font:700 11px/20px 'Gowun Batang',serif;text-align:center;margin-right:2px;opacity:.25}
.gtypes span.on{opacity:1}
.gtypes .t-label{background:#9E3B24}.gtypes .t-review{background:#2B4C7E}.gtypes .t-quiz{background:#2F6B3A}
/* 교사 알림 */
.news{border:1px solid rgba(181,137,31,.45);background:#FFFBF0;border-radius:12px;padding:12px 16px 14px;margin-bottom:16px}
.news .woong{margin-top:0}
.news ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.news li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline;font-size:14px}
.news li b.n{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--red);white-space:nowrap}
.news li small{display:block;color:var(--muted);font-size:12.5px;line-height:1.55}
.news .row{margin-top:12px}
.who .bell{position:relative}
.who .bell i{font-style:normal;background:#D9A93A;color:#271B12;border-radius:999px;padding:0 6px;margin-left:4px;font-size:11.5px;font-weight:700}
/* 독서 기록 */
.rlbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-bottom:12px}
.rlbar .f{display:flex;flex-direction:column}
.rlbar input[type=date],.rlbar select{width:auto;padding:7px 9px;font-size:15px}
.rltable td.books{min-width:260px;line-height:1.6}
.rltable td{vertical-align:top}
/* 내 서재 */
.mstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:14px 0 18px}
.mstat{background:var(--paper-2);border-radius:10px;padding:10px 12px}
.mstat b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.mstat span{font-size:12.5px;color:var(--muted)}
.bookshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 14px;padding:16px 14px 20px;
  background:linear-gradient(to bottom,transparent calc(100% - 10px),#C9A57A calc(100% - 10px));border-radius:4px}
.mbook{display:flex;flex-direction:column;gap:6px;text-align:left;padding:0;min-width:0}
.mbook .cv{position:relative;width:100%;aspect-ratio:3/4.3;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:2px 3px 8px rgba(43,35,32,.28);transition:transform .15s}
.mbook:hover .cv,.mbook[aria-pressed="true"] .cv{transform:translateY(-4px) rotate(-1deg)}
.mbook[aria-pressed="true"] .cv{outline:3px solid var(--gold);outline-offset:2px}
.mbook .cv img{width:100%;height:100%;object-fit:cover;display:block}
.mbook .spine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px;color:#FFF8EC;
  font-family:var(--serif);font-size:15px;line-height:1.3;text-align:center;word-break:keep-all;box-shadow:inset 6px 0 0 rgba(0,0,0,.12)}
.mbook .tt{font-size:13px;font-weight:600;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mbook .dots{display:flex;gap:4px;flex-wrap:wrap}
.mbook .dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot-label{background:#9E3B24}.dot-review{background:#2B4C7E}.dot-quiz{background:#2F6B3A}
.mdetail{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:16px}
.mdetail h4{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 2px}
.mitem{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px}
.qlog{width:100%;max-width:520px}
.qlog td,.qlog th{padding:7px 8px}
@media (max-width:560px){.bookshelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;padding:12px 8px 18px}.mbook .spine{font-size:13px}}
/* 추천 도서 안내 */
.recinfo{background:var(--paper-2);border-radius:12px;padding:14px 16px;margin:4px 0 16px;font-size:14px;line-height:1.7}
.recinfo h4{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 6px}
.recinfo ul{margin:6px 0 0;padding-left:18px}
.recinfo li{margin-bottom:3px}
.recinfo .dday{display:inline-block;font-family:var(--serif);background:var(--red);color:#fff;border-radius:999px;padding:0 10px;font-size:14px;margin-left:6px}
/* 웅이: 웅천(熊川)의 곰. 말풍선으로 안내 */
.woong{display:flex;align-items:flex-end;gap:10px;margin-top:12px}
.woong .bear{width:66px;flex:none}
.woong.big .bear{width:92px}
.woong .bear svg{display:block;width:100%;height:auto;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
.woong .bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.6;margin-bottom:10px}
.woong .bubble::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--paper);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.woong .bubble b.who{font-family:var(--serif);font-weight:400;color:#8B5A3C;margin-right:6px;font-size:15px}
.woong.cheer .bubble{background:var(--gold-soft);border-color:transparent}
.woong.cheer .bubble::before{background:#F4EAD2;border-color:transparent}
.woong .bear{cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.woong .bear:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.woong .bear.m-jump svg{animation:wjump .75s ease}
.woong .bear.m-wiggle svg{animation:wwiggle .8s ease}
.woong .bear.m-spin svg{animation:wspin .8s ease}
.woong .bear.m-nod svg{animation:wnod .7s ease 2}
@keyframes wjump{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}50%{transform:translateY(0)}68%{transform:translateY(-6px)}}
@keyframes wwiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-11deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes wspin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes wnod{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(4px) scaleY(.93)}}
.bubble .fresh-msg{display:block;font-weight:600;color:var(--ink)}
/* 새로 찍힌 도장: 쾅 */
.slot.new .seal{animation:stampIn .65s cubic-bezier(.2,1.5,.4,1) both}
.slot.new{animation:slotGlow 1.6s ease .3s both}
@keyframes stampIn{0%{transform:scale(2) rotate(-24deg);opacity:0}55%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes slotGlow{0%{box-shadow:0 0 0 0 rgba(217,169,58,.55)}100%{box-shadow:0 0 0 12px rgba(217,169,58,0)}}
/* 화면 어디서든 보이게 잠깐 떠오르는 웅이 */
.wpop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:65;width:min(380px,calc(100vw - 32px));animation:popin .4s cubic-bezier(.2,1.3,.4,1) both}
.wpop .woong{margin:0;filter:drop-shadow(0 8px 22px rgba(43,35,32,.22))}
.wpop .bubble{background:#FFFDF8}
.wpop.out{animation:popout .3s ease both}
@keyframes popin{0%{transform:translateY(24px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes popout{to{transform:translateY(16px);opacity:0}}
.guide h4{font-family:var(--serif);font-size:17px;font-weight:400;margin:22px 0 6px}
.guide ol,.guide ul{padding-left:19px;margin:8px 0}
.guide li{margin-bottom:5px;font-size:14px}
.guide .box{background:var(--paper-2);border-left:3px solid var(--gold);padding:12px 15px;font-size:13.5px;margin:12px 0}
.pick{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink);margin:0}
.pick input{margin-top:5px;accent-color:var(--red)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 16px}
.libgrid label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);margin:0;padding:5px 0}
.libgrid input{accent-color:var(--red)}
.sheetbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}

.login{max-width:540px;margin:28px auto 0}
.preview{overflow:hidden}
.preview .sheet{border:1px solid var(--line);transform-origin:top left;margin:0}

  .seg button{min-height:46px;font-size:14.5px}

  .opt{padding:11px 0;font-size:15.5px}
  .opt input,.pick input,.toggle input,.libgrid input{width:20px;height:20px}
  .bk .acts{gap:18px;font-size:14px}
  .bk .acts button,.bk .acts a{padding:8px 0 3px}
  .bk blockquote{font-size:14px}
  .bk .by,.bk .tag,.callno{font-size:13px}
  .st{font-size:13px;padding:3px 10px}
  .libsum{font-size:14px}
  .sitem .by,.shelf-head span{font-size:13.5px}
  .need span{font-size:13.5px;padding:4px 11px}
  .consent{font-size:14.5px}
  .quote .qt{font-size:17px}
  .fitem .fx{font-size:14.5px}
  .mstat span{font-size:13.5px}
  .mbook .tt{font-size:14px}
  .recinfo{font-size:15px}
  .woong .bubble{font-size:15px}
  p.sub{font-size:15px}
  .hint,label,.counter{font-size:14px}
  .meta,.pill{font-size:13px}
  .card .rv{font-size:15.5px;line-height:1.8}
  .q-box p.qt{font-size:16px}
  .tabs button{padding:12px 15px;font-size:15px}
  .who button{padding:7px 14px}
  th,td{font-size:14.5px}
  .done{font-size:14.5px}
  .board-head p,.fresh h3,.slot span{font-size:14px}
  .board-head h2{font-size:19px}
  .mark small{font-size:12.5px}
}
/* 폰: 탭을 화면 아래 고정 막대로(5개 이하일 때). 엄지로 누르기 쉽고 스크롤해도 늘 보인다 */
@media (max-width:760px){
  .tabs.dock{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;
    border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(43,35,32,.08)}
  .tabs.dock button{padding:13px 1px 12px;font-size:13.5px;letter-spacing:-.02em;border-bottom:0;border-top:3px solid transparent;margin:0;min-height:54px}
  .tabs.dock button[aria-selected="true"]{border-top-color:var(--gold);background:var(--paper-2)}
  .tabs.dock .l{display:none}.tabs.dock .s{display:inline}
  .tabs.dock .n{margin-left:3px}
  body.docked .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  body.docked .toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  body.docked .wpop{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
  .top-in{padding:12px 16px}
  .mark small{font-size:11px}
  .board{margin-top:14px}
  .panel{padding-top:18px}
  .scrollx{overflow-x:auto}
  /* 폰에서는 '방금 붙은 라벨'을 서가 탭에서만: 다른 탭은 바로 본문이 보이게 */
  body:not([data-tab="shelf"]) .fresh{display:none}
}
/* 태블릿: 글이 한 줄에 너무 길어지지 않게, 여백은 넉넉히 */
@media (min-width:761px) and (max-width:1100px){
  .wrap,.top-in{padding-left:28px;padding-right:28px}
  p.sub{max-width:62ch}
}
@media (max-width:560px){.board{padding:13px}.slots{gap:5px}.slot{height:62px}.seal{height:38px}.mark{font-size:20px}}
</style>
<style id="sheetcss">
/* 프린텍 V3270: A4 12칸, 100 × 46.4mm. 인쇄 창과 미리보기가 같이 쓴다 */
.sheet{width:210mm;height:296mm;background:#fff;overflow:hidden;box-sizing:border-box}
.sheet-grid{display:grid;grid-template-columns:repeat(2,100mm);grid-auto-rows:46.4mm}
.cell{box-sizing:border-box;overflow:hidden;padding:4mm 6mm 3.4mm;display:flex;flex-direction:column;gap:1.2mm;color:#2B2320;font-family:'Gowun Dodum','Malgun Gothic',sans-serif}
.cell .ct{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:13.5pt;line-height:1.2;color:#9E3B24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cq{font-size:11pt;line-height:1.42;flex:1;overflow:hidden}

.cell .cb{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;font-size:7.6pt;border-top:.25mm solid #bbb;padding-top:1.1mm;display:flex;justify-content:space-between;gap:3mm;color:#6B5C4E;white-space:nowrap}
.cell .cb span{overflow:hidden;text-overflow:ellipsis}
.cell .cb em{font-style:normal;color:#9E3B24}
</style>

<script>
(function(){
"use strict";

/* 독서로 학교 검색: 결과 화면으로 바로 간다 */
function libLink(kw){
  var L=(D&&D.conf.lib)||{neis:"S100000673",prov:"S10",school:"웅천고등학교"};
  return "https://read365.edunet.net/PureScreen/"+(kw?"SchoolSearchResult?searchKeyword="+encodeURIComponent(kw)+"&searchType=&":"SchoolSearch?")+
    "provCode="+L.prov+"&neisCode="+L.neis+"&schoolName="+encodeURIComponent(L.school);
}
var PV="";                        /* 교사의 학생 화면 미리보기: ""=끔, "blank"=빈 학생, 학번 */
var DEMO=!!window.DemoServer;
var UK="ungcheon-seoga-ui";
var D=null;                       /* 서버에서 받은 상태 */
var GATE=null;                    /* 아직 못 들어온 까닭: {kind:"register"|"noemail"|"error",...} */
var ui=Object.assign({tab:"",filter:"전체",libOnly:false,kind:"label",pick:"free",bkind:"label",sel:{},offX:0,offY:0},getJSON(UK));

function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function put(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
function getJSON(k){try{return JSON.parse(get(k)||"{}");}catch(e){return {};}}
function saveUI(){put(UK,JSON.stringify(ui));}
function $(id){return document.getElementById(id);}
function val(id){var e=$(id);return e?e.value.trim():"";}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove();},3200);}
function clsName(c){var m=/^(\d+)-(\d+)$/.exec(c||"");return m?m[1]+"학년 "+m[2]+"반":(c||"");}

/* ── 이 기기 로그인 방법 ──
   자동 로그인을 고르면 이 기기에 로그인 표(토큰)를 남긴다. 끄면 창을 닫을 때 풀린다.
   PIN 은 서버가 확인한다(이 기기에는 저장하지 않는다). */
function loginMode(){try{return localStorage.getItem(TK)?"auto":"ask";}catch(e){return "ask";}}
/* 주소에 담긴 로그인 열쇠(구글 샌드박스가 저장소를 비워도 들어올 수 있게) */
function urlToken(cb){
  try{
    if(window.google&&google.script&&google.script.url&&google.script.url.getLocation)
      return google.script.url.getLocation(function(loc){cb((loc&&loc.parameter&&loc.parameter.t)||"");});
  }catch(e){}
  try{var m=/[?&]t=([A-Za-z0-9]+)/.exec(location.search+location.hash);return cb(m?m[1]:"");}catch(e){}
  cb("");
}
function myLink(){var u=(D&&D.appUrl)||"";var t=tok();return u&&t?u+"?t="+t:"";}
/* ── 서버 호출 ── */
var pending=0;
function busy(d){
  pending+=d;var b=$("busybar");
  if(pending>0&&!b){b=document.createElement("div");b.id="busybar";b.className="busy";document.body.appendChild(b);}
  if(pending<=0&&b)b.remove();
}
/* 메일 로그인: 이 PC에 기억한 토큰(유지 끄면 이 창에서만) */
var TK="ungcheon-seoga-token";
function tok(){try{return localStorage.getItem(TK)||sessionStorage.getItem(TK)||"";}catch(e){return "";}}
function setTok(t,keep){try{localStorage.removeItem(TK);sessionStorage.removeItem(TK);if(t)(keep?localStorage:sessionStorage).setItem(TK,t);}catch(e){}}
function call(name,payload){
  if(D&&D.preview&&name!=="state"&&name!=="libSearch")return Promise.reject(new Error("미리보기 화면에서는 저장되지 않습니다. 위 막대의 ‘교사 화면으로’를 눌러 돌아가세요."));
  busy(1);
  return new Promise(function(res,rej){
    function done(json){
      var r;try{r=JSON.parse(json);}catch(e){rej(new Error("응답을 읽지 못했습니다."));return;}
      if(r&&r.error)rej(new Error(r.error));else res(r);
    }
    var pl=payload||{};var tk=tok();if(tk&&!pl._t)pl=Object.assign({},pl,{_t:tk});
    var body=JSON.stringify(pl);
    if(DEMO)setTimeout(function(){done(window.DemoServer.api(name,body));},60);
    else google.script.run.withSuccessHandler(done).withFailureHandler(function(e){rej(new Error(e&&e.message||"연결에 실패했습니다."));}).api(name,body);
  }).then(function(r){busy(-1);return r;},function(e){busy(-1);throw e;});
}
/* 처리하고 새 화면까지 한 번에 받아 온다(서버 왕복 한 번) */
function act(name,payload,okMsg){
  var pl=Object.assign({},payload||{},{_state:1});if(PV)pl._as=PV;
  return call(name,pl).then(function(res){
    var r=res&&res.state?res.r:res;if(okMsg)toast(okMsg);
    if(res&&res.state){applyState(res.state);return r;}
    return refresh().then(function(){return r;});
  }).catch(function(e){toast(e.message);throw e;});
}
var URLTOK=null;                                  /* 주소에 담긴 열쇠(한 번만 본다) */
function refresh(){
  if(URLTOK===null&&!tok()){
    return new Promise(function(res){urlToken(function(t){URLTOK=t||"";if(t)setTok(t,false);res();});}).then(function(){return refresh();});
  }
  return call("state",PV?{as:PV}:{}).then(applyState).catch(function(e){
    if(e.message==="LOGIN"){setTok("");D=null;GATE={kind:"login",step:"choose"};}
    else if(!D)GATE=e.message==="NOEMAIL"?{kind:"noemail"}:{kind:"error",msg:e.message};
    else toast(e.message);
    renderAll();
  });
}
function applyState(s){
  {
    if(s.need==="login"){D=null;if(tok())setTok("");
      GATE=Object.assign({kind:"login",step:"choose"},GATE&&GATE.kind==="login"?GATE:{},{conf:s.conf});}
    else if(s.need==="register"){D=null;GATE={kind:"register",email:s.email,conf:s.conf};}
    else if(s.need==="consent"){D=null;GATE={kind:"consent",email:s.email,name:s.name,conf:s.conf};}
    else{D=s;GATE=null;}
    var y=window.scrollY;renderAll();
    if(D&&D.me.role!=="student")window.scrollTo(0,y);
  }
}

/* ── 들어오기: 학생은 학번+이름, 교사는 이름. 처음이면 PIN 여섯 자리를 정하고, 다음부터 PIN 이나 자동 로그인 ── */
function renderGate(){
  var g=GATE||{kind:"loading"},h="",len=(g.len||6);
  var keepBox='<label class="agree" style="margin-top:6px"><input type="checkbox" id="g-keep" checked> 이 기기에서 <b>자동 로그인</b> <span class="hint">(내 휴대폰·내 PC 면 켜 두세요. 공용 PC 면 끄세요)</span></label>';
  if(g.kind==="loading")h='<p class="hint" style="text-align:center">불러오는 중…</p>';

    '<p class="sub">학번과 이름을 넣으세요. 처음이면 바로 <b>PIN '+len+'자리</b>를 정하고 들어갑니다. 명단에 없으면 담임 선생님이나 도서관에 말해 주세요.</p>'+
    '<div class="field"><label for="g-h">학번</label><input type="text" id="g-h" inputmode="numeric" maxlength="4" value="'+esc(g.hakbun||"")+'" placeholder="예) 1101"></div>'+
    '<div class="field"><label for="g-n">이름</label><input type="text" id="g-n" value="'+esc(g.name0||"")+'"></div>'+
    '<button class="btn" id="g-next" style="width:100%">다음</button>'+
    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="g-back">처음으로</button></div>';
  else if(g.kind==="login"&&g.step==="teacher")h='<h3 class="sec">선생님</h3>'+
    '<p class="sub">이름을 넣으세요. 교사 명단에 있으면 바로 <b>PIN '+len+'자리</b>를 정하고 들어갑니다. 명단에 없으면 관리자(사서) 선생님 승인을 받습니다.</p>'+
    '<div class="field"><label for="g-n">이름</label><input type="text" id="g-n" value="'+esc(g.name0||"")+'"></div>'+
    '<button class="btn" id="g-next" style="width:100%">다음</button>'+
    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="g-back">처음으로</button></div>';
  else if(g.kind==="pin")h='<h3 class="sec">'+esc(g.name||"")+' — PIN '+len+'자리</h3>'+
    '<p class="sub">정해 둔 번호를 넣어 주세요. 다섯 번 틀리면 10분 동안 잠깁니다. 잊었으면 선생님께 말하면 새로 정할 수 있어요.</p>'+
    '<div class="field"><label for="g-pin">PIN</label><input type="password" id="g-pin" inputmode="numeric" maxlength="'+len+'" autocomplete="current-password"></div>'+
    keepBox+'<button class="btn" id="g-go" style="width:100%;margin-top:10px">들어가기</button>'+
    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="g-back">처음으로</button></div>';
  else if(g.kind==="setpin")h='<h3 class="sec">'+esc(g.name||"")+' — PIN '+len+'자리 정하기</h3>'+
    '<p class="sub">다음부터 이 번호로 들어옵니다. 같은 숫자나 이어지는 숫자(111111·123456)는 쓸 수 없어요. 잊으면 선생님이 새로 정하게 해 줍니다.</p>'+
    '<div class="field"><label for="g-pin1">PIN '+len+'자리</label><input type="password" id="g-pin1" inputmode="numeric" maxlength="'+len+'" autocomplete="new-password"></div>'+
    '<div class="field"><label for="g-pin2">한 번 더</label><input type="password" id="g-pin2" inputmode="numeric" maxlength="'+len+'" autocomplete="new-password"></div>'+
    keepBox+'<button class="btn" id="g-setpin" style="width:100%;margin-top:10px">이 PIN 으로 시작하기</button>'+
    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="g-back">처음으로</button></div>';
  else if(g.kind==="login"&&g.step==="consent")h='<h3 class="sec">'+esc(g.name||"")+' 학생, 처음 한 번만 확인해 주세요</h3>'+
    consentHTML(g.conf)+'<button class="btn" id="g-agree2" style="width:100%" disabled>동의하고 PIN 정하기</button>'+
    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="g-back">처음으로</button></div>';
  else if(g.kind==="login"&&g.step==="approval")h='<h3 class="sec">등록을 요청했어요</h3>'+
    '<p class="sub"><b>'+esc(g.name||"")+'</b> 선생님 — 교사 명단에 아직 없는 이름이라 관리자(사서) 선생님께 등록 요청을 보냈습니다. 승인되면 이름으로 들어와 PIN 을 정하시면 됩니다.</p>'+
    '<button class="btn ghost" id="g-back">처음으로</button>';
  else if(g.kind==="login")h='<h3 class="sec">누구신가요?</h3>'+
    '<p class="sub">학생은 <b>학번·이름</b>, 선생님은 <b>이름</b>으로 들어옵니다. 처음 한 번 PIN 여섯 자리를 정하면, 다음부터는 PIN 이나 자동 로그인으로 들어옵니다.</p>'+
    '<div class="rolepick"><button class="btn" id="g-stu">학생</button><button class="btn ghost" id="g-tch">선생님</button></div>';
  else if(g.kind==="register")h='<h3 class="sec">처음 오셨네요</h3>'+
    '<p class="sub">학번과 이름을 한 번만 등록하면 다음부터는 바로 들어옵니다.</p>'+
    '<div class="field"><label for="g-h">학번</label><input type="text" id="g-h" inputmode="numeric"></div>'+
    '<div class="field"><label for="g-n">이름</label><input type="text" id="g-n"></div>'+
    consentHTML(g.conf)+
    '<button class="btn" id="g-go2" style="width:100%" disabled>동의하고 등록하기</button>';
  else if(g.kind==="consent")h='<h3 class="sec">'+esc(g.name)+' 학생, 시작 전에 확인해 주세요</h3>'+

    '<p class="sub" style="margin:0">계정을 확인하지 못했습니다. 학교에서 받은 구글 계정으로 로그인한 뒤 이 주소를 다시 열어 주세요.</p>';
  else h='<h3 class="sec">들어오지 못했습니다</h3><p class="sub">'+esc(g.msg)+'</p><button class="btn ghost" id="g-retry">다시 시도</button>';
  var hello=g.kind==="consent"||g.kind==="register"||g.kind==="login"?woong("hi","안녕! 나는 <b>웅이</b>야. 웅천(熊川)의 곰이지. 등록만 하면 같이 책 읽을 수 있어.","big"):
    g.kind==="loading"?woong("read","잠깐만, 서가 정리하는 중…"):"";
  var qq=g.conf&&g.conf.quote;
  var qh=qq?'<section class="quote" style="margin:0 0 14px"><div class="qk">오늘의 '+(qq.kind==="책 속 한 줄"?"책 속 한 줄":"명언")+'</div><p class="qt">'+esc(qq.text)+'</p><div class="qs">— '+esc(qq.src)+'</div></section>':"";
  $("login").innerHTML='<div class="login">'+qh+hello+'<div class="form" style="margin-top:12px">'+h+'</div></div>';
}
/* 로그인 한 걸음: 서버가 다음에 무엇이 필요한지 알려 준다 */
function loginStep(extra){
  var g=GATE||{},role=(g.role||g.step)==="teacher"?"teacher":"student";
  var pl={role:role,hakbun:g.hakbun||val("g-h"),name:g.name0||val("g-n"),
    remember:!($("g-keep")&&!$("g-keep").checked)};
  Object.keys(extra||{}).forEach(function(k){pl[k]=extra[k];});
  if(role==="student"&&!pl.hakbun){toast("학번을 넣어 주세요.");return;}
  if(!pl.name){toast("이름을 넣어 주세요.");return;}
  call("login",pl).then(function(r){
    var base={kind:"login",role:role,step:role,hakbun:pl.hakbun,name0:pl.name,conf:(GATE||{}).conf};
    if(r.need==="consent"){GATE=Object.assign({},base,{step:"consent",name:r.name});renderGate();return;}
    if(r.need==="approval"){GATE=Object.assign({},base,{step:"approval",name:r.name});renderGate();return;}
    if(r.need==="setpin"){GATE=Object.assign({},base,{kind:"setpin",name:r.name,len:r.len});renderGate();
      setTimeout(function(){var x=$("g-pin1");if(x)x.focus();},60);return;}
    if(r.need==="pin"){GATE=Object.assign({},base,{kind:"pin",name:r.name,len:r.len});renderGate();
      setTimeout(function(){var x=$("g-pin");if(x)x.focus();},60);return;}
    if(r.token){setTok(r.token,r.remember!==false);GATE={kind:"loading"};renderGate();
      toast(r.newPin?"PIN 을 정했습니다. 다음부터 이 번호로 들어오세요.":"로그인했습니다.");refresh();return;}
  }).catch(function(e){toast(e.message);});
}
function setPinGo(){
  var a=val("g-pin1"),b=val("g-pin2");
  if(a!==b){toast("두 번 적은 PIN 이 다릅니다.");return;}
  loginStep({newPin:a,agree:true});
}
function setPreview(v){
  var prev=PV;PV=v;
  return call("state",PV?{as:PV}:{}).then(function(s){D=s;renderAll();window.scrollTo(0,0);})
    .catch(function(e){PV=prev;toast(e.message);});
}
/* 개인정보 수집·이용 안내(설정 시트의 보유기간·개인정보담당을 쓴다) */
function consentHTML(conf){
  var pv=(conf&&conf.privacy)||{},keep=pv.keep||"졸업식 날까지",owner=pv.owner||"도서관 담당 교사";
  return '<div class="consent" tabindex="0" aria-label="개인정보 수집·이용 안내"><b>개인정보 수집·이용 안내</b>'+
    '<table><tr><th>목적</th><td>독서 프로그램 운영(글 게시, 도장판 도장·상품권 확인, 이달의 글 시상과 상품 지급)</td></tr>'+
    '<tr><th>항목</th><td>학번, 이름, 학급, 로그인 메일 주소, 내가 쓴 글과 참여 기록</td></tr>'+
    '<tr><th>공개 범위</th><td>게시판에는 이름 없이 학급만 보입니다. 이름은 담임·담당 선생님만 봅니다. 상품권을 나눠 줄 때는 도서부 학생이 대상 학생의 학번·이름·학급을 확인합니다. 투표는 누가 누구를 뽑았는지 남기지 않습니다.</td></tr>'+
    '<tr><th>보유 기간</th><td>'+esc(keep)+'. 그 뒤 지웁니다.</td></tr>'+
    '<tr><th>거부할 권리</th><td>동의하지 않을 수 있고, 불이익은 없습니다. 다만 글쓰기·투표 등 참여는 할 수 없습니다. 동의를 거두거나 내 기록을 지우고 싶으면 '+esc(owner)+'에게 말해 주세요.</td></tr></table></div>'+
    '<label class="agree"><input type="checkbox" id="g-ok"> 위 내용을 읽었고, 개인정보 수집·이용에 동의합니다.</label>';
}
function lastMail(){try{return localStorage.getItem("ungcheon-seoga-mail")||"";}catch(e){return "";}}
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;var id=e.target&&e.target.id;
  if(id==="g-h"){e.preventDefault();var n0=$("g-n");if(n0)n0.focus();}
  else if(id==="g-n"){e.preventDefault();loginStep();}
  else if(id==="g-pin"){e.preventDefault();loginStep({pin:val("g-pin")});}
  else if(id==="g-pin1"){e.preventDefault();var p2=$("g-pin2");if(p2)p2.focus();}
  else if(id==="g-pin2"){e.preventDefault();setPinGo();}
  else if(id==="desk-q"){e.preventDefault();deskLook();}
});
function doRegister(){
  if(!($("g-ok")&&$("g-ok").checked)){toast("개인정보 수집·이용에 동의해 주세요.");return;}
  call("register",{hakbun:val("g-h"),name:val("g-n"),agree:true}).then(function(){toast("등록했습니다.");return refresh();})
    .catch(function(e){toast(e.message);});
}

/* ── 공통 조각 ── */
/* 웅이: 갈색곰. pose = "read"(책 읽기) | "hi"(손 흔들기) | "yay"(만세) */
function bearSVG(pose){

function ymdLocal(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function md(s){var m=/^\d{4}-(\d{2})-(\d{2})/.exec(s||"");return m?Number(m[1])+"월 "+Number(m[2])+"일":"";}
function mdhm(s){var m=/ (\d{2}):(\d{2})/.exec(s||"");return md(s)+(m?" "+m[1]+":"+m[2]:"");}
function canBorrow(b){return b.lib===true&&(b.avail==null||b.avail>0);}
function libBadge(b){
  if(b.lib===true){
    if(b.total&&b.avail!=null&&b.avail>=0){
      var part=b.chk&&b.chk<b.total;   /* 학급문고처럼 많은 책은 앞 몇 권만 확인 */
      if(b.avail>0)return '<span class="st ok">대출 가능 '+(part?'· 소장 '+b.total+'권':b.avail+'/'+b.total+'권')+'</span>';
      if(part)return '<span class="st ok">소장 '+b.total+'권 · 도서관에서 확인</span>';
      var soon=b.due&&b.due>=ymdLocal();
      return '<span class="st out">모두 대출 중'+(soon?' · '+md(b.due)+' 반납 예정':'')+'</span>';
    }
    return '<span class="st ok">도서관에 있음</span>';
  }
  if(b.lib===false)return '<span class="st none">학교 도서관에 없음</span>';
  return '';
}

function periodLabel(pd){

  var a=/^(\d{4})-(\d{2})/.exec(pd.from),b=/^(\d{4})-(\d{2})/.exec(pd.to);if(!a||!b)return "";
  return pd.from===pd.to?Number(a[2])+"월":Number(a[2])+"~"+Number(b[2])+"월";

function endOf(pd){var b=/^(\d{4})-(\d{2})/.exec(pd.to);return new Date(Number(b[1]),Number(b[2]),0);}
function untilText(pd){var e=endOf(pd);return (e.getMonth()+1)+"월 "+e.getDate()+"일까지 · 매달 1일에 바뀝니다";}
function nextChange(pd){var e=endOf(pd),n=new Date(e.getFullYear(),e.getMonth()+1,1);return (n.getMonth()+1)+"월 1일";}

function copyText(t,done){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);
    a.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}a.remove();if(done)done(ok);}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){if(done)done(true);},fb);return;}}catch(e){}

  if(N.picked.length)items.push('<li><b class="n">문제 채택 '+N.picked.length+'개</b><span>'+esc(N.picked.map(function(x){return x.cls+" "+x.name+" 『"+x.title+"』";}).join(", "))+'<small>학생이 낸 문제가 북퀴즈에 뽑혔어요</small></span></li>');

  var head=N.first?"선생님, 최근 7일 동안 이런 일이 있었어요.":"선생님, 지난번 확인("+mdhm(N.since)+") 이후 새 소식이에요.";
  if(!N.total)head="선생님, 새 글은 없어요. 챙길 일만 알려 드릴게요.";

var SPINE=["#8B5A3C","#9E3B24","#2B4C7E","#2F6B3A","#6B4F8A","#B5891F","#3E6A6E","#7A4A5A"];
function bkey(t){return String(t||"").replace(/^\s*[(\[][^)\]]*[)\]]\s*/,"").split(/\s*[:=]\s*/)[0].replace(/[\s·,.'"“”‘’()\[\]:;!?『』「」<>-]/g,"").toLowerCase();}
function spineColor(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return SPINE[h%SPINE.length];}
var ST_NAME={posted:["게시 중",""],waiting:["확인 대기","grey"],returned:["보완 요청","grey"],down:["내려감","grey"]};
function mineBooks(){
  var by={},order=[];
  function slot(t,a){var k=bkey(t);if(!by[k]){by[k]={k:k,t:t,a:a||"",cover:(D.covers||{})[k]||"",posts:[],quiz:[],last:""};order.push(k);}return by[k];}
  (D.mine||[]).forEach(function(p){var b=slot(p.title,p.author);b.posts.push(p);if(!b.cover&&p.cover)b.cover=p.cover;if(!b.area&&p.area)b.area=p.area;if(p.date>b.last)b.last=p.date;if(!b.a&&p.author)b.a=p.author;});
  (D.myQuiz||[]).forEach(function(q){var b=slot(q.book,"");b.quiz.push(q);if(q.date>b.last)b.last=q.date;});
  return order.map(function(k){return by[k];}).sort(function(x,y){return x.last<y.last?1:-1;});
}

function doSearch(q){

}

function wireWrite(){
  var ta=$("w-text"),c=$("w-count"),b=$("w-send"),sel=$("w-book"),pv=$("w-prev"),fr=$("w-free"),
      ti=$("w-t"),au=$("w-a"),hd=$("w-h"),why=$("w-why"),pg=$("w-pg");
  var isL=ui.kind==="label",lim=D.conf.limit[ui.kind];
  function cur(){
    var free=sel.value==="free",bk=D.books.filter(function(x){return x.id===sel.value;})[0];
    return {kind:ui.kind,bookId:sel.value,title:free?ti.value.trim():bk.t,author:free?au.value.trim():bk.a,call:free?"":bk.call,
      cls:D.me.cls,head:hd?hd.value.trim():"",text:ta.value.trim(),why:why.value.trim(),page:pg?pg.value.trim():""};
  }
  function upd(){
    var o=cur(),n=o.text.length;
    fr.hidden=sel.value!=="free";
    c.textContent=n+"자 / "+lim.join("~");c.className="counter"+(n>lim[1]?" over":"");
    b.disabled=n<lim[0]||n>lim[1]||!o.title||o.why.length<5||(!isL&&!o.page);
    if(!o.text)o.text=isL?"여기에 쓴 글이 이대로 인쇄됩니다.":"여기에 쓴 글이 게시판에 올라갑니다.";
    pv.innerHTML=isL?labelHTML(o):'<div class="card">'+reviewHTML(o)+'</div>';
  }
  [ta,ti,au,hd,why,pg].forEach(function(e){if(e)e.addEventListener("input",upd);});
  sel.addEventListener("change",function(){ui.pick=sel.value;saveUI();upd();});
  if(sel.value==="free"&&ui.freeT){ti.value=ui.freeT;au.value=ui.freeA||"";ui.freeT="";ui.freeA="";}
  upd();
  b.addEventListener("click",function(){
    b.disabled=true;
    act("submit",cur()).then(function(r){
      ui.pick="free";saveUI();
      toast(r.status==="waiting"?"제출했습니다. 담임 선생님 확인 후 게시됩니다.":"게시했습니다. 도서관에서 스티커를 받아 가세요.");
    }).catch(function(){b.disabled=false;});
  });
}

/* 학생마다 다른 차례로 섞는다(학번+날짜를 씨앗으로) — 늦게 올린 글도 눈에 띄게 */
function seedNum(s){var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
function myShuffle(list){
  var seed=seedNum((D.me&&D.me.id||"")+"|"+(D.today||""));
  return list.map(function(l,i){return {l:l,r:seedNum(l.id+"|"+seed)};})
    .sort(function(a,b){return a.r-b.r;}).map(function(x){return x.l;});
}
function wallList(){
  var f=ui.wf||"mine",q=(ui.wq||"").replace(/\s/g,"").toLowerCase(),list=(D.board||[]).slice();
  if(f==="label"||f==="review")list=list.filter(function(l){return l.kind===f;});
  if(f==="won")list=list.filter(function(l){return l.won||l.honor;});
  if(q)list=list.filter(function(l){return (l.title+(l.author||"")).replace(/\s/g,"").toLowerCase().indexOf(q)>=0;});
  if(f==="mine")list=myShuffle(list);                                   /* 나에게 보이는 차례 */
  else list.sort(function(a,b){return (b.likes||0)-(a.likes||0);});     /* 전체 보기 = 읽고 싶어요 많은 순 */
  return list;

function sendQuiz(){
  var ans={};
  D.quiz.items.forEach(function(q){var s=document.querySelector('input[name="qz-'+q.id+'"]:checked');if(s)ans[q.id]=Number(s.value);});
  if(Object.keys(ans).length<D.quiz.items.length){toast("모든 문제에 답을 골라 주세요.");return;}
  call("quizAnswer",{answers:ans}).then(function(r){
    D.quiz.done=r.score;
    r.res.forEach(function(x){
      var fb=$("fb-"+x.id);if(!fb)return;fb.hidden=false;fb.className="fb"+(x.ok?" ok":"");
      fb.textContent=(x.ok?"정답입니다. ":"정답은 "+(x.right+1)+"번입니다. ")+x.why;});
    var b=$("q-send");if(b)b.remove();
    call("state",PV?{as:PV}:{}).then(function(s2){if(s2&&!s2.need){D=s2;renderBoard();}}).catch(function(){});
    toast(r.score+" / "+r.total+" 정답"+(r.score===r.total?" — 도서관에서 스티커를 받아 가세요.":""));
  }).catch(function(e){toast(e.message);});
}

function wireTLabel(){
  var t=$("t-t"),a=$("t-a"),x=$("t-x"),c=$("t-c"),b=$("t-send"),pv=$("t-prev"),lim=D.conf.limit.label;
  function upd(){
    var n=x.value.trim().length;

    act("staffLabel",{title:t.value.trim(),author:a.value.trim(),text:x.value.trim()},"라벨을 올렸습니다. 금요일에 인쇄됩니다.").catch(function(){b.disabled=false;});});

/* 문제 은행(예비): 기간별·책별로 접어서 */
function bankHTML(){
  var bank=D.quiz.filter(function(q){return q.status==="예비";}),by={},mons=[];
  bank.forEach(function(q){if(!by[q.month]){by[q.month]={};mons.push(q.month);}(by[q.month][q.book]=by[q.month][q.book]||[]).push(q);});
  if(!mons.length)return '<h3 class="sec gap">문제 은행</h3><div class="empty">아직 만들어 둔 문제가 없습니다. 추천 도서를 뽑으면 자동으로 만들어집니다.</div>';
  var KN={about:"소개글",keyword:"핵심어",author:"지은이",call:"청구기호",kdc:"분야"};
  return '<h3 class="sec gap">문제 은행</h3><p class="sub">학생 문제가 모자랄 때 쓰는 예비 문제입니다. 한 번 출제된 문제는 목록에서 빠집니다.</p>'+
    mons.sort().map(function(m){
      var mm=/^\d{4}-(\d{2})/.exec(m),books=Object.keys(by[m]),n=books.reduce(function(a,k){return a+by[m][k].length;},0);
      return '<details class="box" style="margin:0 0 10px"><summary><b>'+(mm?Number(mm[1])+'월':esc(m))+' 추천 도서</b> · '+books.length+'권 '+n+'문제</summary>'+
        books.map(function(bk){return '<div style="margin:10px 0 0"><b>『'+esc(bk)+'』</b>'+by[m][bk].map(function(q){
          return '<div class="meta" style="padding:4px 0;align-items:flex-start"><span class="pill grey">'+(KN[(q.reason||"").replace(/^자동:/,"")]||"자동")+'</span><span style="flex:1">'+esc(q.q)+
            ' <span class="hint">→ '+esc(q.o[q.ans-1]||"")+'</span></span><button class="btn ghost sm" data-qdrop="'+q.id+'">빼기</button></div>';}).join("")+'</div>';}).join("")+
        '</details>';}).join("");
}

    act("ideaAdd",{text:tx},"보냈어요. 선생님이 읽고 답해 주실 거예요.").then(function(){var e=document.getElementById("idea-t");if(e)e.value="";}).catch(function(e){toast(e.message);});return;}
  if(d.idea){act("ideaReply",{id:d.idea,text:val("ir-"+d.idea)},"답변을 보냈습니다.").catch(function(e){toast(e.message);});return;}
  if(d.ideadel){act("ideaReply",{id:d.ideadel,del:1},"지웠습니다.").catch(function(e){toast(e.message);});return;}
  if(id==="ev-go"){act("eventSet",{name:val("ev-n"),from:val("ev-f"),to:val("ev-t"),mul:val("ev-m"),target:val("ev-g"),kind:val("ev-k"),memo:val("ev-memo")},"이벤트를 열었습니다.")
      .then(function(){["ev-n","ev-f","ev-t","ev-g","ev-memo"].forEach(function(k){var e=document.getElementById(k);if(e)e.value="";});}).catch(function(e){toast(e.message);});return;}
  if(d.evhide){act("eventHide",{name:d.evhide,from:d.from},"이벤트를 내렸습니다.").catch(function(e){toast(e.message);});return;}
  if(d.theme){var i=d.i;act("themeSet",{week:d.theme,title:val("th-t"+i),body:val("th-b"+i),area:val("th-a"+i)},val("th-t"+i)?"이 주의 주제를 올렸습니다.":"그 주 주제를 비웠습니다.").catch(function(e){toast(e.message);});return;}
  if(d.honor){act("honor",{id:d.honor,mon:d.mon,off:!!d.off},d.off?"명예의 전당에서 내렸습니다.":"명예의 전당에 올렸습니다.").catch(function(){});return;}
  if(id==="gift-all"){var gw=giftWin(),ids=(D.gifts.rows[gw]||[]).filter(function(x){return x.vouchers>0&&!x.paid;}).map(function(x){return x.hakbun;});
    if(!ids.length){toast("모두 배부 완료 상태입니다.");return;}
    if(!window.confirm("대상 "+ids.length+"명을 모두 배부 완료로 표시할까요?"))return;
    act("giftMark",{from:gw,ids:ids,on:true},ids.length+"명을 배부 완료로 표시했습니다.").catch(function(){});return;}
  if(id==="gift-csv"){var gw2=giftWin(),gr=[["학번","이름","학급","별","상품권(매)","배부","처리","수령 서명"]];
    (D.gifts.rows[gw2]||[]).forEach(function(x){gr.push([x.hakbun,x.name,x.cls,x.stars,x.vouchers,x.paid?"완료":"",x.who||"",""]);});
    csvDown("상품권_"+gw2+".csv",gr);return;}
  if(d.award){act("award",{id:d.award,off:!!d.off},d.off?"수상을 취소했습니다.":"수상 처리했습니다.").catch(function(){});return;}

  if(id==="lib-run"){
    t.disabled=true;t.textContent="확인하는 중… (30초쯤)";
    call("libRefresh",{}).then(function(r){
      ui.libMsg=(r.picked?"이번 달 추천 도서 "+r.picked+"권을 뽑았습니다. ":"")+(r.suspect?"책 제목 조회가 한 권도 맞지 않아 지난 값을 그대로 두었습니다. ":"")+"대출 상태: "+r.checked+"권을 확인했습니다. "+r.found+"권이 학교 도서관에 있습니다."+(r.failed?" "+r.failed+"권은 독서로 응답이 없어 지난 값을 그대로 두었습니다.":"");
      return refresh();}).catch(function(e){toast(e.message);t.disabled=false;t.textContent="지금 전체 확인";});return;}
  if(id==="a-send"){act("bookAdd",{t:val("a-t"),a:val("a-a"),s:val("a-s"),rec:val("a-r"),q:val("a-q")}).then(function(r){
      var b=r.book||{};
      toast("서가에 올렸습니다. "+(r.failed?"독서로 확인은 실패했습니다.":r.found?"학교 도서관에 있습니다"+(b.total?" (대출 가능 "+b.avail+"/"+b.total+"권)":"")+".":"학교 도서관에서는 찾지 못했습니다."));
    }).catch(function(){});return;}
  if(d.qpick){act("quizPick",{id:d.qpick,next:!!d.next},"출제했습니다.").catch(function(){});return;}
  if(d.qdrop){act("quizDrop",{id:d.qdrop}).catch(function(){});return;}
  if(id==="qz-auto"){act("quizAuto",{}).then(function(r){toast(r.added?"이번 주 "+r.added+"문제를 채웠습니다(학생 "+r.student+", 자동 "+r.auto+").":"이번 주 문제는 이미 다 찼습니다.");}).catch(function(){});return;}
  if(d.qadd){var p=quizPayload("qa-");p.next=d.qadd==="1";act("quizAdd",p,"문제를 넣었습니다.").catch(function(){});return;}
});

function renderAll(){
  var inn=!!D;
  $("login").hidden=inn;$("app").hidden=!inn;
  if(!inn){$("who").innerHTML="";if(GATE&&GATE.conf){$("mk-name").textContent=GATE.conf.name;$("mk-sub").textContent=GATE.conf.sub;}renderGate();return;}
  $("mk-name").textContent=D.conf.name;$("mk-sub").textContent=D.conf.sub;document.title=D.conf.name;
  var pv=D.preview;
  document.body.classList.toggle("role-staff",D.me.role!=="student"&&!pv);
  $("who").innerHTML=pv?'<span>학생 화면 미리보기</span>'
    :(D.me.role!=="student"?'<span class="stafftag">'+esc(D.me.label||"교사용")+'</span>':D.me.club?'<span class="stafftag club">도서부</span>':'')+
     (D.me.role==="student"&&D.progress?'<span class="starbadge" title="도장 '+(D.conf.weekCap||5)+'개마다 별 하나">'+starSVG()+starCount()+'</span>':'')+'<span><b>'+esc(D.me.name)+'</b>'+(D.me.role==="student"?' · '+esc(D.me.cls):D.me.role==="admin"?' 선생님 · 담당':' 선생님 · '+esc(D.me.cls)+' 담임')+'</span>'+
     (D.me.role==="student"?'<button id="notice-open" class="bell nt" type="button">공지사항'+(noticeCount()?'<i>'+noticeCount()+'</i>':'')+'</button><button id="guide-open" class="help guide-red" type="button">이용 안내</button>':'')+
     (D.me.role!=="student"&&D.news&&D.news.total?'<button id="news-open" class="bell" type="button">새 소식<i>'+D.news.total+'</i></button>':'')+
     (D.me.role!=="student"?'<button id="pv-open" type="button">학생 화면</button>':'')+
     (D.conf.loginMode==="mail"?'<button id="logout" class="help" type="button">로그아웃</button>':'');
  $("pvbar").hidden=!pv;
  if(pv)$("pvbar").innerHTML='<span>'+(pv.as?'<b>'+esc(D.me.name)+'</b>('+esc(pv.as)+') 학생이 보는 화면':'<b>아직 아무것도 안 한 학생</b>이 보는 화면')+
    ' · 보기만 되고 저장은 되지 않습니다.</span>'+
    '<span><input type="text" id="pv-h" inputmode="numeric" placeholder="학번" value="'+esc(pv.as)+'"> <button id="pv-go" type="button">이 학생으로 보기</button> '+
    (pv.as?'<button id="pv-blank" type="button">빈 학생</button>':'')+'</span>'+
    '<button id="pv-close" class="end" type="button">교사 화면으로</button>';
  renderQuote();renderBoard();renderTabs();renderPanel();renderFeed();
  /* 처음 온 학생에게는 이용 안내를 한 번 띄운다 */
  if(D.me.role==="student"&&!pv&&$("reader").hidden&&get("ungcheon-seoga-guide|"+D.me.id)!=="1")openGuide();
}

renderAll();
refresh();
})();
</script>
</body>
