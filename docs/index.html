<script>
(function(){
"use strict";

/* 독서로 학교 검색: 결과 화면으로 바로 간다 */
function libLink(kw){
  var L=(D&&D.conf.lib)||{neis:"S100000673",prov:"S10",school:"웅천고등학교"};
  return "https://read365.edunet.net/PureScreen/"+(kw?"SchoolSearchResult?searchKeyword="+encodeURIComponent(kw)+"&searchType=&":"SchoolSearch?")+
    "provCode="+L.prov+"&neisCode="+L.neis+"&schoolName="+encodeURIComponent(L.school);
}
var PV="";                        /* 교사의 학생 화면 미리보기: ""=끔, "blank"=빈 학생, 학번 */
var DEMO=!!window.DemoServer;
var UK="ungcheon-seoga-ui";
var D=null;                       /* 서버에서 받은 상태 */
var GATE=null;                    /* 아직 못 들어온 까닭: {kind:"register"|"noemail"|"error",...} */
var ui=Object.assign({tab:"",filter:"전체",libOnly:false,kind:"label",pick:"free",bkind:"label",sel:{},offX:0,offY:0},getJSON(UK));

function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function put(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
function getJSON(k){try{return JSON.parse(get(k)||"{}");}catch(e){return {};}}
function saveUI(){put(UK,JSON.stringify(ui));}
function $(id){return document.getElementById(id);}
function val(id){var e=$(id);return e?e.value.trim():"";}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove();},3200);}
function clsName(c){var m=/^(\d+)-(\d+)$/.exec(c||"");return m?m[1]+"학년 "+m[2]+"반":(c||"");}

/* ── 이 기기 로그인 방법 ──
   자동 로그인을 고르면 이 기기에 로그인 표(토큰)를 남긴다. 끄면 창을 닫을 때 풀린다.
   PIN 은 서버가 확인한다(이 기기에는 저장하지 않는다). */
function loginMode(){try{return localStorage.getItem(TK)?"auto":"ask";}catch(e){return "ask";}}
/* 주소에 담긴 로그인 열쇠(구글 샌드박스가 저장소를 비워도 들어올 수 있게) */
function urlToken(cb){
  try{
    if(window.google&&google.script&&google.script.url&&google.script.url.getLocation)
      return google.script.url.getLocation(function(loc){cb((loc&&loc.parameter&&loc.parameter.t)||"");});
  }catch(e){}
  try{var m=/[?&]t=([A-Za-z0-9]+)/.exec(location.search+location.hash);return cb(m?m[1]:"");}catch(e){}
  cb("");
}
function myLink(){var u=(D&&D.appUrl)||"";var t=tok();return u&&t?u+"?t="+t:"";}
/* ── 서버 호출 ── */
var pending=0;
function busy(d){
  pending+=d;var b=$("busybar");
  if(pending>0&&!b){b=document.createElement("div");b.id="busybar";b.className="busy";document.body.appendChild(b);}
  if(pending<=0&&b)b.remove();
}
/* 메일 로그인: 이 PC에 기억한 토큰(유지 끄면 이 창에서만) */
var TK="ungcheon-seoga-token";
function tok(){try{return localStorage.getItem(TK)||sessionStorage.getItem(TK)||"";}catch(e){return "";}}
function setTok(t,keep){try{localStorage.removeItem(TK);sessionStorage.removeItem(TK);if(t)(keep?localStorage:sessionStorage).setItem(TK,t);}catch(e){}}
function call(name,payload){
  if(D&&D.preview&&name!=="state"&&name!=="libSearch")return Promise.reject(new Error("미리보기 화면에서는 저장되지 않습니다. 위 막대의 ‘교사 화면으로’를 눌러 돌아가세요."));
  busy(1);
  return new Promise(function(res,rej){
    function done(json){
      var r;try{r=JSON.parse(json);}catch(e){rej(new Error("응답을 읽지 못했습니다."));return;}
      if(r&&r.error)rej(new Error(r.error));else res(r);
    }
    var pl=payload||{};var tk=tok();if(tk&&!pl._t)pl=Object.assign({},pl,{_t:tk});
    var body=JSON.stringify(pl);
    if(DEMO)setTimeout(function(){done(window.DemoServer.api(name,body));},60);
    else google.script.run.withSuccessHandler(done).withFailureHandler(function(e){rej(new Error(e&&e.message||"연결에 실패했습니다."));}).api(name,body);
  }).then(function(r){busy(-1);return r;},function(e){busy(-1);throw e;});
}
/* 처리하고 새 화면까지 한 번에 받아 온다(서버 왕복 한 번) */
function act(name,payload,okMsg){
  var pl=Object.assign({},payload||{},{_state:1});if(PV)pl._as=PV;
  return call(name,pl).then(function(res){
    var r=res&&res.state?res.r:res;if(okMsg)toast(okMsg);
    if(res&&res.state){applyState(res.state);return r;}
    return refresh().then(function(){return r;});
  }).catch(function(e){toast(e.message);throw e;});
}
var URLTOK=null;                                  /* 주소에 담긴 열쇠(한 번만 본다) */
function refresh(){
  if(URLTOK===null&&!tok()){
    return new Promise(function(res){urlToken(function(t){URLTOK=t||"";if(t)setTok(t,false);res();});}).then(function(){return refresh();});
  }
  return call("state",PV?{as:PV}:{}).then(applyState).catch(function(e){
    if(e.message==="LOGIN"){setTok("");D=null;GATE={kind:"login",step:"choose"};}
    else if(!D)GATE=e.message==="NOEMAIL"?{kind:"noemail"}:{kind:"error",msg:e.message};
    else toast(e.message);
    renderAll();
  });
}
function applyState(s){
  {
    if(s.need==="login"){D=null;if(tok())setTok("");
      GATE=Object.assign({kind:"login",step:"choose"},GATE&&GATE.kind==="login"?GATE:{},{conf:s.conf});}
    else if(s.need==="register"){D=null;GATE={kind:"register",email:s.email,conf:s.conf};}
    else if(s.need==="consent"){D=null;GATE={kind:"consent",email:s.email,name:s.name,conf:s.conf};}
    else{D=s;GATE=null;}
    var y=window.scrollY;renderAll();
    if(D&&D.me.role!=="student")window.scrollTo(0,y);
  }
}

/* ── 들어오기: 학생은 학번+이름, 교사는 이름. 처음이면 PIN 여섯 자리를 정하고, 다음부터 PIN 이나 자동 로그인 ── */
function renderGate(){
  var g=GATE||{kind:"loading"},h="",len=(g.len||6);
  var keepBox='<label class="agree" style="margin-top:6px"><input type="checkbox" id="g-keep" checked> 이 기기에서 <b>자동 로그인</b> <span class="hint">(내 휴대폰·내 PC 면 켜 두세요. 공용 PC 면 끄세요)</span></label>';

function loginStep(extra){
  var g=GATE||{},role=(g.role||g.step)==="teacher"?"teacher":"student";
  var pl={role:role,hakbun:g.hakbun||val("g-h"),name:g.name0||val("g-n"),
    remember:!($("g-keep")&&!$("g-keep").checked)};
  Object.keys(extra||{}).forEach(function(k){pl[k]=extra[k];});
  if(role==="student"&&!pl.hakbun){toast("학번을 넣어 주세요.");return;}
  if(!pl.name){toast("이름을 넣어 주세요.");return;}
  call("login",pl).then(function(r){
    var base={kind:"login",role:role,step:role,hakbun:pl.hakbun,name0:pl.name,conf:(GATE||{}).conf};
    if(r.need==="consent"){GATE=Object.assign({},base,{step:"consent",name:r.name});renderGate();return;}
    if(r.need==="approval"){GATE=Object.assign({},base,{step:"approval",name:r.name});renderGate();return;}
    if(r.need==="setpin"){GATE=Object.assign({},base,{kind:"setpin",name:r.name,len:r.len});renderGate();
      setTimeout(function(){var x=$("g-pin1");if(x)x.focus();},60);return;}
    if(r.need==="pin"){GATE=Object.assign({},base,{kind:"pin",name:r.name,len:r.len});renderGate();
      setTimeout(function(){var x=$("g-pin");if(x)x.focus();},60);return;}
    if(r.token){setTok(r.token,r.remember!==false);GATE={kind:"loading"};renderGate();
      toast(r.newPin?"PIN 을 정했습니다. 다음부터 이 번호로 들어오세요.":"로그인했습니다.");refresh();return;}
  }).catch(function(e){toast(e.message);});
}

function cheerPool(){
  if(!D||!D.me)return CHEER_S;
  if(D.me.role!=="student")return CHEER_T;
  var extra=[];
  if(D.canWrite&&D.thisMonth&&D.conf.giftTypes){
    var has=D.thisMonth.types||{};
    if(D.week&&D.week.stamps.length>=D.conf.weekCap)extra.push("이번 주 도장은 꽉 찼어. 더 하면 책갈피가 쌓이고, 월요일에 새 칸이 열려.");
    if(!has.label)extra.push("라벨 한 줄부터 가 보자. 40자면 돼.");
    if(!has.review)extra.push("독후감 칸이 비어 있네. 300자, 쓰기 시작하면 금방이야.");
    if(!has.quiz)extra.push("이번 주 북퀴즈 풀어 봤어? 절반만 맞혀도 도장이야.");
  }
  return CHEER_S.concat(extra,extra);   /* 상황 맞춤 말이 조금 더 자주 나오게 */
}

function poke(bear){
  var box=bear.closest(".woong"),bub=box&&box.querySelector(".bubble");if(!bub)return;
  var pool=D&&D.me&&D.me.role!=="student"&&!D.preview?CHEER_T:cheerPool(),i;
  do{i=Math.floor(Math.random()*pool.length);}while(pool.length>1&&i===lastCheer);
  lastCheer=i;
  var pose=pick(["hi","read","yay"]),mv=pick(MOVES);
  bear.innerHTML=bearSVG(pose);bear.setAttribute("data-pose",pose);
  MOVES.forEach(function(m){bear.classList.remove("m-"+m);});
  void bear.offsetWidth;bear.classList.add("m-"+mv);

  if(x&&x.bonus)return pick((D.conf.monthCap>0&&D.thisMonth&&D.thisMonth.count>=D.conf.monthCap)?PRAISE.bonusMonth:PRAISE.bonusWeek);

function ymdLocal(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function md(s){var m=/^\d{4}-(\d{2})-(\d{2})/.exec(s||"");return m?Number(m[1])+"월 "+Number(m[2])+"일":"";}
function mdhm(s){var m=/ (\d{2}):(\d{2})/.exec(s||"");return md(s)+(m?" "+m[1]+":"+m[2]:"");}
function canBorrow(b){return b.lib===true&&(b.avail==null||b.avail>0);}
function libBadge(b){
  if(b.lib===true){
    if(b.total&&b.avail!=null&&b.avail>=0){
      var part=b.chk&&b.chk<b.total;   /* 학급문고처럼 많은 책은 앞 몇 권만 확인 */
      if(b.avail>0)return '<span class="st ok">대출 가능 '+(part?b.avail+'권 · 소장 '+b.total+'권 중 '+b.chk+'권 확인':b.avail+'/'+b.total+'권')+'</span>';
      if(part)return '<span class="st ok">소장 '+b.total+'권 · '+b.chk+'권만 확인됨</span>';   /* 나머지는 상태를 못 받아 온 것 */
      var soon=b.due&&b.due>=ymdLocal();
      return '<span class="st out">모두 대출 중'+(soon?' · '+md(b.due)+' 반납 예정':'')+'</span>';
    }
    return '<span class="st ok">도서관에 있음</span>';
  }
  if(b.lib===false)return '<span class="st none">학교 도서관에 없음</span>';
  return '';
}

function copyText(t,done){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);
    a.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}a.remove();if(done)done(ok);}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){if(done)done(true);},fb);return;}}catch(e){}
  fb();
}

function bkey(t){return String(t||"").replace(/^\s*[(\[][^)\]]*[)\]]\s*/,"").split(/\s*[:=]\s*/)[0].replace(/[\s·,.'"“”‘’()\[\]:;!?『』「」<>-]/g,"").toLowerCase();}
function spineColor(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return SPINE[h%SPINE.length];}
var ST_NAME={posted:["게시 중",""],waiting:["확인 대기","grey"],returned:["보완 요청","grey"],down:["내려감","grey"]};
function mineBooks(){
  var by={},order=[];
  function slot(t,a){var k=bkey(t);if(!by[k]){by[k]={k:k,t:t,a:a||"",cover:(D.covers||{})[k]||"",posts:[],quiz:[],last:""};order.push(k);}return by[k];}
  (D.mine||[]).forEach(function(p){var b=slot(p.title,p.author);b.posts.push(p);if(!b.cover&&p.cover)b.cover=p.cover;if(!b.area&&p.area)b.area=p.area;if(p.date>b.last)b.last=p.date;if(!b.a&&p.author)b.a=p.author;});
  (D.myQuiz||[]).forEach(function(q){var b=slot(q.book,"");b.quiz.push(q);if(q.date>b.last)b.last=q.date;});
  return order.map(function(k){return by[k];}).sort(function(x,y){return x.last<y.last?1:-1;});
}

function wireWrite(){

      ti=$("w-t"),au=$("w-a"),hd=$("w-h"),why=$("w-why"),pg=$("w-pg");
  var K=ui.kind==="review"?"review":ui.kind==="quote"?"quote":"label",lim=D.conf.limit[K]||[40,90];
  var isL=K==="label";
  function cur(){
    var free=sel.value==="free",bk=D.books.filter(function(x){return x.id===sel.value;})[0];
    var cb=$("w-comic");
    return {kind:K,bookId:sel.value,title:free?ti.value.trim():bk.t,author:free?au.value.trim():bk.a,call:free?"":bk.call,
      cls:D.me.cls,head:hd?hd.value.trim():"",text:ta.value.trim(),why:why.value.trim(),page:pg?pg.value.trim():"",
      comic:!!(cb&&cb.checked)};
  }
  function upd(){
    var o=cur(),n=o.text.length;
    fr.hidden=sel.value!=="free";
    c.textContent=n+"자 / "+lim.join("~");c.className="counter"+(n>lim[1]?" over":"");
    b.disabled=n<lim[0]||n>lim[1]||!o.title||o.why.length<5||(!isL&&!o.page);
    if(!o.text)o.text=isL?"여기에 쓴 글이 이대로 인쇄됩니다.":"여기에 쓴 글이 게시판에 올라갑니다.";
    pv.innerHTML=isL?labelHTML(o):K==="quote"?quoteHTML(o):'<div class="card">'+reviewHTML(o)+'</div>';
  }
  [ta,ti,au,hd,why,pg].forEach(function(e){if(e)e.addEventListener("input",upd);});
  sel.addEventListener("change",function(){ui.pick=sel.value;saveUI();
    var nb=D.books.filter(function(x){return x.id===sel.value;})[0];
    if(nb&&nb.comic){ui.comic=true;if(ui.kind==="review")ui.kind="label";saveUI();renderPanel();return;}
    upd();});
  if(sel.value==="free"&&ui.freeT){ti.value=ui.freeT;au.value=ui.freeA||"";ui.freeT="";ui.freeA="";}
  upd();
  b.addEventListener("click",function(){
    b.disabled=true;
    act("submit",cur()).then(function(r){
      ui.pick="free";saveUI();
      toast(r.status==="waiting"?"제출했습니다. 담임 선생님 확인 후 게시됩니다.":
        K==="label"?"게시했습니다. 도서관에서 스티커를 받아 가세요.":"게시했습니다.");
    }).catch(function(){b.disabled=false;});
  });
}

/* 날짜 "2026-10-05" → "10월 5일(월)" */
function dayLabel(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");if(!m)return esc(d||"");

/* 학생마다 다른 차례로 섞는다(학번+날짜를 씨앗으로) — 늦게 올린 글도 눈에 띄게 */
function seedNum(s){var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
function myShuffle(list){
  var seed=seedNum((D.me&&D.me.id||"")+"|"+(D.today||""));
  return list.map(function(l,i){return {l:l,r:seedNum(l.id+"|"+seed)};})
    .sort(function(a,b){return a.r-b.r;}).map(function(x){return x.l;});
}
function wallList(){
  var f=ui.wf||"mine",q=(ui.wq||"").replace(/\s/g,"").toLowerCase(),list=(D.board||[]).slice();
  if(f==="label"||f==="quote"||f==="review")list=list.filter(function(l){return l.kind===f;});
  if(f==="won")list=list.filter(function(l){return l.won||l.honor;});
  if(q)list=list.filter(function(l){return (l.title+(l.author||"")).replace(/\s/g,"").toLowerCase().indexOf(q)>=0;});
  if(f==="mine")list=myShuffle(list);                                   /* 나에게 보이는 차례 */
  else list.sort(function(a,b){return (b.likes||0)-(a.likes||0);});     /* 전체 보기 = 읽고 싶어요 많은 순 */
  return list;
}

function sendQuiz(){
  var ans={};
  D.quiz.items.forEach(function(q){var s=document.querySelector('input[name="qz-'+q.id+'"]:checked');if(s)ans[q.id]=Number(s.value);});
  if(Object.keys(ans).length<D.quiz.items.length){toast("모든 문제에 답을 골라 주세요.");return;}
  call("quizAnswer",{answers:ans}).then(function(r){
    D.quiz.done=r.score;
    r.res.forEach(function(x){
      var fb=$("fb-"+x.id);if(!fb)return;fb.hidden=false;fb.className="fb"+(x.ok?" ok":"");
      fb.textContent=(x.ok?"정답입니다. ":"정답은 "+(x.right+1)+"번입니다. ")+x.why;});
    var b=$("q-send");if(b)b.remove();
    call("state",PV?{as:PV}:{}).then(function(s2){if(s2&&!s2.need){D=s2;renderBoard();}}).catch(function(){});
    toast(r.score+" / "+r.total+" 정답"+(r.score===r.total?" — 도서관에서 스티커를 받아 가세요.":""));
  }).catch(function(e){toast(e.message);});
}

  bank.forEach(function(q){if(!by[q.month]){by[q.month]={};mons.push(q.month);}(by[q.month][q.book]=by[q.month][q.book]||[]).push(q);});
  if(!mons.length)return '<h3 class="sec gap">문제 은행</h3><div class="empty">아직 만들어 둔 문제가 없습니다. 추천 도서를 뽑으면 자동으로 만들어집니다.</div>';

  return '<h3 class="sec gap">문제 은행</h3><p class="sub">학생 문제가 모자랄 때 쓰는 예비 문제입니다. 한 번 출제된 문제는 목록에서 빠집니다.</p>'+
    mons.sort().map(function(m){

        '</details>';}).join("");

function guideHomeroom(){

    ["월간 집계","지난달 글의 득표 순위와 글쓴이(이 화면에서만 보임). 이미 상을 받은 학생은 표시되니 건너뛰세요. ‘수상 처리’한 글은 게시판에 ‘이달의 글’로 뜹니다. <b>참여 추첨</b>은 지난달에 한 편이라도 낸 학생 중 상을 안 받은 학생을 무작위로 뽑습니다. 부문별 3위 안 만능 도장은 따로 자동으로 찍힙니다."],

  if(id==="pv-blank"){setPreview("blank");return;}
  if(id==="pv-go"){var h=val("pv-h");if(h)setPreview(h);else toast("학번을 입력해 주세요.");return;}
  if(d.vote){act("vote",{id:d.vote,kind:d.vkind},"투표했습니다. 누가 뽑았는지는 기록되지 않습니다.").catch(function(){});return;}
  if(id==="q-send"){sendQuiz();return;}
  if(id==="q-tomake"){var el=document.getElementById("qs-b");if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.focus();}return;}
  if(id==="qs-send"){act("quizSubmit",quizPayload("qs-")).then(function(r){
      toast(r.stamped?"문제를 냈습니다. 품질 "+r.score+"/10 — 도장 1개를 받았어요!"
        :"문제를 냈습니다. 품질 "+r.score+"/10 — "+r.bar+"점이 넘으면 도장을 받아요. 쪽수와 해설을 채우면 점수가 올라가요.");}).catch(function(){});return;}

  if(d.mode){act("setMode",{approve:d.mode==="approve"}).catch(function(){});return;}
  if(d.approve){act("approve",{id:d.approve},"도장을 찍었습니다.").catch(function(){});return;}
  if(d.restore){act("restore",{id:d.restore},"다시 게시했습니다.").catch(function(){});return;}
  if(d.down){
    var memo=window.prompt(D.conf.approve?"학생에게 보일 보완 요청 한 줄":"학생에게 보일 메모 (비워도 됩니다)",D.conf.approve?"왜 이 책이 남았는지 한 줄만 더":"");
    if(memo===null)return;
    act("takedown",{id:d.down,memo:memo},D.conf.approve?"보완 요청으로 되돌렸습니다.":"글을 내렸습니다.").catch(function(){});return;}
  if(id==="ack"){act("ackAll",{}).catch(function(){});return;}
  if(id==="rb-go"){var tx=val("rb-t");if(!tx){toast("붙여 넣을 내용을 적어 주세요.");return;}
    call("rosterBulk",{text:tx}).then(function(r){
      toast(r.ok+"명 등록"+(r.made?"(새로 "+r.made+"명)":"")+(r.badN?" · 문제 "+r.badN+"줄":""));
      if(r.badN)ui.accOut={list:[]},toast(r.bad.join(" / "));
      var e=document.getElementById("rb-t");if(e&&!r.badN)e.value="";
      if(ui.accQ)call("rosterFind",{q:ui.accQ}).then(function(x){ui.accOut=x;renderPanel();});
    }).catch(function(e){toast(e.message);});return;}
  if(id==="ra-go"){act("rosterAdd",{hakbun:val("ra-h"),name:val("ra-n"),memo:val("ra-b")},"명단에 넣었습니다. 그 학생이 학번·이름으로 들어와 PIN 을 정하면 됩니다.").then(function(){
      ["ra-h","ra-n","ra-b"].forEach(function(k){var e=document.getElementById(k);if(e)e.value="";});
      if(ui.accQ)call("rosterFind",{q:ui.accQ}).then(function(r){ui.accOut=r;renderPanel();});}).catch(function(e){toast(e.message);});return;}
  if(d.unlock){act("unlockAccount",{hakbun:d.unlock},"잠금을 풀었습니다.").then(function(){
      if(ui.accQ)call("rosterFind",{q:ui.accQ}).then(function(r){ui.accOut=r;renderPanel();});}).catch(function(e){toast(e.message);});return;}
  if(id==="acc-go"){ui.accQ=val("acc-q");saveUI();call("rosterFind",{q:ui.accQ}).then(function(r){ui.accOut=r;renderPanel();}).catch(function(e){toast(e.message);});return;}
  if(d.pinreset||d.accfull){var hb0=d.pinreset||d.accfull,full=!!d.accfull;
    act(full?"resetAccount":"pinReset",{hakbun:hb0,full:full},hb0+" 학생은 다음에 들어올 때 PIN 을 새로 정합니다."+(full?" 개인정보 동의도 다시 받습니다.":"")).then(function(){
      if(ui.accQ)call("rosterFind",{q:ui.accQ}).then(function(r){ui.accOut=r;renderPanel();});}).catch(function(e){toast(e.message);});return;}

  if(id==="p-go"){doPrint();return;}
  if(id==="p-done"){var ids=selected().map(function(l){return l.id;});if(!ids.length){toast("고른 라벨이 없습니다.");return;}
    ui.sel={};saveUI();act("markPrinted",{ids:ids},ids.length+"장을 인쇄함으로 표시했습니다.").catch(function(){});return;}
  if(id==="p-csv"){var rows=[["학급","책제목","지은이","추천문"]];selected().forEach(function(l){rows.push([l.cls,l.title,l.author,l.text]);});csvDown("라벨목록.csv",rows);return;}
  if(d.gm){act("giftMark",{from:giftWin(),ids:[d.gm],on:d.on==="1"}).catch(function(){});return;}
  if(id==="ps-go"){doPoster();return;}
  if(id==="ps-cert"){doCert();return;}
  if(id==="ps-notice"){doNotice();return;}
  if(id==="idea-go"){var tx=val("idea-t");if(!tx){toast("하고 싶은 말을 적어 주세요.");return;}
    act("ideaAdd",{text:tx},"보냈어요. 선생님이 읽고 답해 주실 거예요.").then(function(){var e=document.getElementById("idea-t");if(e)e.value="";}).catch(function(e){toast(e.message);});return;}
  if(d.idea){act("ideaReply",{id:d.idea,text:val("ir-"+d.idea)},"답변을 보냈습니다.").catch(function(e){toast(e.message);});return;}
  if(d.ideadel){act("ideaReply",{id:d.ideadel,del:1},"지웠습니다.").catch(function(e){toast(e.message);});return;}
  if(id==="ev-go"){act("eventSet",{name:val("ev-n"),way:val("ev-w"),from:val("ev-f"),to:val("ev-t"),val:val("ev-v"),prize:val("ev-p"),target:val("ev-g"),kind:val("ev-k"),memo:val("ev-memo")},"이벤트를 열었습니다.")
      .then(function(){["ev-n","ev-f","ev-t","ev-g","ev-memo"].forEach(function(k){var e=document.getElementById(k);if(e)e.value="";});}).catch(function(e){toast(e.message);});return;}
  if(d.evdraw){act("eventDraw",{name:d.evdraw,from:d.from,again:!!d.again},"추첨했습니다.").catch(function(e){toast(e.message);});return;}
  if(d.evhide){act("eventHide",{name:d.evhide,from:d.from},"이벤트를 내렸습니다.").catch(function(e){toast(e.message);});return;}
  if(d.theme){var i=d.i;act("themeSet",{week:d.theme,title:val("th-t"+i),body:val("th-b"+i),area:val("th-a"+i)},val("th-t"+i)?"이 주의 주제를 올렸습니다.":"그 주 주제를 비웠습니다.").catch(function(e){toast(e.message);});return;}
  if(d.honor){act("honor",{id:d.honor,mon:d.mon,off:!!d.off},d.off?"명예의 전당에서 내렸습니다.":"명예의 전당에 올렸습니다.").catch(function(){});return;}
  if(id==="gift-all"){var gw=giftWin(),ids=(D.gifts.rows[gw]||[]).filter(function(x){return x.vouchers>0&&!x.paid;}).map(function(x){return x.hakbun;});
    if(!ids.length){toast("모두 배부 완료 상태입니다.");return;}
    if(!window.confirm("대상 "+ids.length+"명을 모두 배부 완료로 표시할까요?"))return;
    act("giftMark",{from:gw,ids:ids,on:true},ids.length+"명을 배부 완료로 표시했습니다.").catch(function(){});return;}
  if(id==="gift-csv"){var gw2=giftWin(),gr=[["학번","이름","학급","별","상품권(매)","배부","처리","수령 서명"]];
    (D.gifts.rows[gw2]||[]).forEach(function(x){gr.push([x.hakbun,x.name,x.cls,x.stars,x.vouchers,x.paid?"완료":"",x.who||"",""]);});
    csvDown("상품권_"+gw2+".csv",gr);return;}
  if(id==="gv-go"){ui.giveQ=val("gv-q");saveUI();call("stampFind",{q:ui.giveQ}).then(function(r){ui.giveOut=r;renderPanel();}).catch(function(e){toast(e.message);});return;}
  if(d.givewhy){ui.giveWhy=ui.giveWhy===d.givewhy?"":d.givewhy;saveUI();renderPanel();return;}
  if(d.give){var why=val("gv-"+d.give);
    if(!why||why.trim().length<2){toast("왜 주는지 한 마디 적어 주세요.");return;}
    act("stampGive",{hakbun:d.give,reason:why},"도장을 찍어 주었습니다.").then(function(){
      if(ui.giveQ)call("stampFind",{q:ui.giveQ}).then(function(r){ui.giveOut=r;renderPanel();});}).catch(function(){});return;}
  if(d.giveundo){act("stampUndo",{id:d.giveundo},"도장을 무렀습니다.").then(function(){
      if(ui.giveQ)call("stampFind",{q:ui.giveQ}).then(function(r){ui.giveOut=r;renderPanel();});}).catch(function(){});return;}
  if(d.award){act("award",{id:d.award,off:!!d.off},d.off?"수상을 취소했습니다.":"수상 처리했습니다.").catch(function(){});return;}

  if(id==="lib-run"){
    t.disabled=true;t.textContent="확인하는 중… (30초쯤)";
    call("libRefresh",{}).then(function(r){
      ui.libMsg=(r.picked?"이번 달 추천 도서 "+r.picked+"권을 뽑았습니다. ":"")+(r.suspect?"책 제목 조회가 한 권도 맞지 않아 지난 값을 그대로 두었습니다. ":"")+"대출 상태: "+r.checked+"권을 확인했습니다. "+r.found+"권이 학교 도서관에 있습니다."+(r.failed?" "+r.failed+"권은 독서로 응답이 없어 지난 값을 그대로 두었습니다.":"");
      return refresh();}).catch(function(e){toast(e.message);t.disabled=false;t.textContent="지금 전체 확인";});return;}
  if(id==="a-send"){act("bookAdd",{t:val("a-t"),a:val("a-a"),s:val("a-s"),rec:val("a-r"),q:val("a-q")}).then(function(r){
      var b=r.book||{};
      toast("서가에 올렸습니다. "+(r.failed?"독서로 확인은 실패했습니다.":r.found?"학교 도서관에 있습니다"+(b.total?" (대출 가능 "+b.avail+"/"+b.total+"권)":"")+".":"학교 도서관에서는 찾지 못했습니다."));
    }).catch(function(){});return;}
  if(d.qpick){act("quizPick",{id:d.qpick,next:!!d.next},"출제했습니다.").catch(function(){});return;}
  if(d.qdrop){act("quizDrop",{id:d.qdrop}).catch(function(){});return;}
  if(id==="qz-auto"){act("quizAuto",{}).then(function(r){toast(r.added?"이번 주 "+r.added+"문제를 채웠습니다(학생 "+r.student+", 자동 "+r.auto+").":"이번 주 문제는 이미 다 찼습니다.");}).catch(function(){});return;}
  if(d.qadd){var p=quizPayload("qa-");p.next=d.qadd==="1";act("quizAdd",p,"문제를 넣었습니다.").catch(function(){});return;}
});

function renderAll(){
  var inn=!!D;
  $("login").hidden=inn;$("app").hidden=!inn;
  if(!inn){$("who").innerHTML="";if(GATE&&GATE.conf){$("mk-name").textContent=GATE.conf.name;$("mk-sub").textContent=GATE.conf.sub;}renderGate();return;}
  $("mk-name").textContent=D.conf.name;$("mk-sub").textContent=D.conf.sub;document.title=D.conf.name;
  var pv=D.preview;
  document.body.classList.toggle("role-staff",D.me.role!=="student"&&!pv);
  $("who").innerHTML=pv?'<span>학생 화면 미리보기</span>'
    :(D.me.role!=="student"?'<span class="stafftag">'+esc(D.me.label||"교사용")+'</span>':D.me.club?'<span class="stafftag club">도서부</span>':'')+
     (D.me.role==="student"&&D.progress?'<span class="starbadge" title="도장 '+(D.conf.weekCap||5)+'개마다 별 하나">'+starSVG()+starCount()+'</span>':'')+'<span><b>'+esc(D.me.name)+'</b>'+(D.me.role==="student"?' · '+esc(D.me.cls):D.me.role==="admin"?' 선생님 · 담당':' 선생님 · '+esc(D.me.cls)+' 담임')+'</span>'+
     (D.me.role==="student"?'<button id="notice-open" class="bell nt" type="button">공지사항'+(noticeCount()?'<i>'+noticeCount()+'</i>':'')+'</button><button id="guide-open" class="help guide-red" type="button">이용 안내</button>':'')+
     (D.me.role!=="student"&&D.news&&D.news.total?'<button id="news-open" class="bell" type="button">새 소식<i>'+D.news.total+'</i></button>':'')+
     (D.me.role!=="student"?'<button id="pv-open" type="button">학생 화면</button>':'')+
     (D.conf.loginMode!=="google"?'<button id="logout" class="help" type="button">로그아웃</button>':'');
  $("pvbar").hidden=!pv;
  if(pv)$("pvbar").innerHTML='<span>'+(pv.as?'<b>'+esc(D.me.name)+'</b>('+esc(pv.as)+') 학생이 보는 화면':'<b>아직 아무것도 안 한 학생</b>이 보는 화면')+
    ' · 보기만 되고 저장은 되지 않습니다.</span>'+
    '<span><input type="text" id="pv-h" inputmode="numeric" placeholder="학번" value="'+esc(pv.as)+'"> <button id="pv-go" type="button">이 학생으로 보기</button> '+
    (pv.as?'<button id="pv-blank" type="button">빈 학생</button>':'')+'</span>'+
    '<button id="pv-close" class="end" type="button">교사 화면으로</button>';
  renderQuote();renderBoard();renderTabs();renderPanel();renderFeed();
  /* 처음 온 학생에게는 이용 안내를 한 번 띄운다 */
  if(D.me.role==="student"&&!pv&&$("reader").hidden&&get("ungcheon-seoga-guide|"+D.me.id)!=="1")openGuide();
}

renderAll();
refresh();
})();
</script>
</body>
</html>
