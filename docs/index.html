<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웅천 서가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --bark:#3A2A1E;--bark-2:#271B12;--paper:#FAF7F0;--paper-2:#F0E9D9;
  --ink:#2B2320;--muted:#7A6B5C;--gold:#B5891F;--gold-soft:rgba(181,137,31,.13);
  --red:#9E3B24;--red-soft:rgba(158,59,36,.10);--ok:#2F6B3A;--ok-soft:rgba(47,107,58,.12);
  --line:rgba(43,35,32,.15);--radius:3px;
  /* 제목·로고: 주아체 / 본문·화면: 프리텐다드 / 라벨·독후감 본문: 고운돋움 / 도장 한자: 고운바탕 */
  --serif:'Jua','Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  --soft:'Gowun Dodum','Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  --sans:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:var(--red)}
[hidden]{display:none!important}

.top{background:var(--bark);color:#F2E7D2;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-30px;top:-40px;width:220px;height:220px;
  background:radial-gradient(circle at 30% 70%,rgba(181,137,31,.22),transparent 62%);pointer-events:none}
.top-in{max-width:1000px;margin:0 auto;padding:16px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.emb{height:44px;width:auto;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.mark small.school{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;opacity:.72;margin:0 0 1px}
.mark{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:.01em;line-height:1.2}
.mark small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;letter-spacing:.09em;opacity:.6;margin-top:1px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.who button{padding:4px 12px;font-size:12.5px;color:#F2E7D2;border:1px solid rgba(242,231,210,.3);border-radius:999px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 90px}
.demo{background:var(--gold-soft);font-size:12.5px;text-align:center;padding:6px 12px;color:var(--ink)}

.board{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);margin-top:20px;padding:15px 17px 16px;position:relative;overflow:hidden}
.board-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.board-head h2{font-family:var(--serif);font-size:20px;font-weight:400;margin:0}
.board-head p{margin:0;font-size:13px;color:var(--muted)}
.board-head .count{margin-left:auto;font-family:var(--serif);font-size:15px}
.board-head .count b{font-size:24px;color:var(--red)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{height:74px;border:1px dashed var(--line);border-radius:2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--paper);position:relative;overflow:hidden}
.slot span{font-size:11px;color:var(--muted)}
.slot.on{border-style:solid;border-color:var(--red-soft)}
.seal{height:46px;transform:rotate(-7deg);margin-bottom:10px}
.slot .lb{position:absolute;bottom:4px;font-size:10px;color:var(--muted);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{margin-top:11px;padding:9px 12px;background:var(--gold-soft);border-radius:2px;font-size:13.5px}
.fresh{margin-top:16px}
.fresh h3{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 8px}
.fresh-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.fresh-row{grid-template-columns:1fr 1fr}.fresh-row .label:nth-child(n+3){display:none}}
@media (max-width:560px){.fresh-row{grid-template-columns:1fr}.fresh-row .label:nth-child(n+2){display:none}}

.tabs{display:flex;gap:2px;margin-top:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  position:sticky;top:0;z-index:20;background:var(--paper)}
.tabs::-webkit-scrollbar{display:none}
.tabs .s{display:none}
.tabs button{padding:10px 13px;font-size:14px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--gold)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.panel{padding-top:22px}
h3.sec{font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 4px}
h3.sec.gap{margin-top:34px}
p.sub{margin:0 0 16px;font-size:13.5px;color:var(--muted);max-width:68ch}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--bark);border-color:var(--bark);color:#F2E7D2}
.toggle{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.toggle input{accent-color:var(--red)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(228px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.bk{background:var(--paper);padding:14px 15px;display:flex;flex-direction:column;gap:5px}
.bk .tag{font-size:11.5px;color:var(--gold)}
.bk .tag b{font-weight:500;color:var(--red)}
.bk h4{font-family:var(--serif);font-size:17px;font-weight:400;margin:0;line-height:1.35}
.bk .by{font-size:12.5px;color:var(--muted);margin:-2px 0 0}
.bk .avail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:2px}
.st{display:inline-block;font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.out{background:var(--red-soft);color:var(--red)}
.st.none{background:var(--paper-2);color:var(--muted);font-weight:500}
.callno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.libsum{font-size:13px;color:var(--muted);margin:-8px 0 14px}
/* 서가 카드: 표지가 있으면 왼쪽에 */
.bk.has-cover{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 12px;align-content:start}
.bk.has-cover>.cov{grid-row:1 / span 6}
.bk .cov.ph{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 6px;color:#FFF3DE;text-align:center;box-sizing:border-box}
.bk .cov.ph em{font-style:normal;font-family:var(--serif);font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bk .cov.ph i{font-style:normal;font-size:9.5px;opacity:.85}
.bk .cov{width:62px;aspect-ratio:3/4.3;object-fit:cover;border-radius:2px;box-shadow:0 1px 3px rgba(43,35,32,.25);background:var(--paper-2);max-width:100%}
.bk.has-cover>*:not(.cov){grid-column:2}
.shelf-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.shelf-head h4{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
.shelf-head span{font-size:13px;color:var(--muted)}
/* 도서 검색 */
.sbar{display:flex;gap:8px;margin-bottom:14px}
.sbar input{flex:1}
.sres{display:grid;gap:10px}
.sitem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--paper)}
.sitem .cov{grid-row:1 / span 4;width:56px;aspect-ratio:3/4.3;object-fit:cover;border-radius:2px;background:var(--paper-2);max-width:100%}
.sitem h4{font-family:var(--serif);font-size:17px;font-weight:400;margin:0;line-height:1.35}
.sitem .by{font-size:12.5px;color:var(--muted);margin:0}
.sitem .row{gap:6px 12px}
/* 도장 종류별 */
.need{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.need span{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.need span.ok{border-color:transparent;color:#fff}
.need .nlab{border:0;background:none;padding:3px 0;color:var(--muted)}
.need .nmiss{border:0;background:none;color:#9E3B24;font-weight:600}
.need .nmiss.ok2{color:#2F6B3A}
.need .k-label.ok,.need .k-write.ok{background:#9E3B24}.need .k-review.ok{background:#2B4C7E}.need .k-quiz.ok{background:#2F6B3A}
.need .k-wild.ok{background:#7A4B8A;color:#fff}.need .k-wild small{opacity:.75}
/* 개인정보 안내 */
.consent{border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:12px 14px;font-size:13.5px;line-height:1.65;max-height:260px;overflow:auto;margin-bottom:12px}
.consent table{font-size:13px}
.consent th{white-space:nowrap;width:5.5em}
.agree{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink);margin:0 0 14px;cursor:pointer}
.agree input{margin-top:4px;width:18px;height:18px;accent-color:var(--red);flex:none}
/* 교사 안내 */
.todo{width:100%;margin:6px 0 4px}
.todo td:first-child{white-space:nowrap;color:var(--gold);font-weight:600;width:6.5em}
.howto dt{font-weight:600;margin-top:10px;font-size:14px}
.howto dd{margin:2px 0 0;font-size:14px;color:var(--ink)}
.pvbar{margin-top:14px;background:var(--bark);color:#F2E7D2;border-radius:var(--radius);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px}
.pvbar b{color:#F5D27A}
.pvbar input[type=text]{width:120px;padding:6px 9px;font-size:15px;background:#FAF7F0;color:#2B2320;border:0}
.pvbar button{color:#F2E7D2;border:1px solid rgba(242,231,210,.4);border-radius:999px;padding:5px 12px;font-size:13px}
.pvbar .end{margin-left:auto}
.bk blockquote{margin:3px 0 0;padding-left:10px;border-left:2px solid var(--gold-soft);font-size:12.5px;line-height:1.55}
.bk .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px;font-size:12.5px}
.bk .acts button,.bk .acts a{color:var(--red);border-bottom:1px solid currentColor;padding:0 0 1px;text-decoration:none;line-height:1.5}

.form{background:var(--paper-2);border:1px solid var(--line);padding:17px;border-radius:var(--radius)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
select,input[type=text],input[type=search],input[type=password],input[type=number],input[type=date],textarea{width:100%;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font-size:16px}
textarea{resize:vertical;min-height:92px;line-height:1.7}
.field{margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{flex:1;padding:8px;font-size:13.5px;color:var(--muted);background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--bark);color:#F2E7D2;font-weight:500}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.counter.over{color:var(--red)}
.btn{background:var(--red);color:#fff;padding:10px 20px;border-radius:2px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.two>*{min-width:0}
@media (max-width:780px){.two{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}

/* 라벨: 화면과 인쇄가 같은 비율(100 × 46.4) */
.label{background:#fff;color:#2B2320;border:1px solid rgba(43,35,32,.2);border-radius:2px;
  aspect-ratio:100/46.4;padding:4.2% 5%;display:flex;flex-direction:column;gap:3%;overflow:hidden;container-type:inline-size}
.label .lt{font-family:var(--serif);font-weight:400;color:#9E3B24;font-size:max(16px,4.8cqw);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .q{font-family:var(--soft);font-size:max(14px,3.9cqw);line-height:1.42;flex:1;overflow:hidden}
.label.short .q{font-size:max(15px,4.4cqw)}
.label .bt2{font-size:max(11px,2.7cqw);border-top:1px solid rgba(43,35,32,.18);padding-top:1.6%;display:flex;justify-content:space-between;gap:8px;color:#6B5C4E;white-space:nowrap}
.label .bt2 span{overflow:hidden;text-overflow:ellipsis}
.label .bt2 em{font-style:normal;color:#9E3B24}

.stack{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:2px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:9px}
.card .rv{font-size:14px;line-height:1.75;white-space:pre-wrap}
.card .rvh{font-family:var(--serif);font-size:17px;font-weight:400}
.card .rv{font-family:var(--soft)}
.card .rvb{font-size:12.5px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.gapline{height:1px;background:var(--line);margin:26px 0 20px}
.pill.theme{background:#E7F0E2;color:#3C5A32;border-color:#BBD3AF}
.evbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:linear-gradient(90deg,#FDECEA,#FFF3C9);border:2px solid #B0301E;border-radius:12px;padding:9px 14px;margin:0 0 14px;color:#8A1F12}
.evbar .x{font-family:Jua,sans-serif;font-size:20px;background:#B0301E;color:#fff;border-radius:10px;padding:1px 9px}
.evbar b{font-family:var(--serif);font-weight:400;font-size:17px}
.evbar .ed{font-size:12.5px;background:#fff;border:1px solid #E9B4AA;border-radius:999px;padding:1px 8px}
.evbar .et{font-size:13.5px}
.themebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#EFF6EA;border:1px solid #CADFBE;border-radius:12px;padding:9px 14px;margin:0 0 14px;color:#33502A}
.themebar .tp{font-size:12px;background:#3C5A32;color:#fff;border-radius:999px;padding:2px 9px}
.themebar b{font-family:var(--serif);font-weight:400;font-size:17px}
.themebar .ta{font-size:12.5px;background:#fff;border:1px solid #CADFBE;border-radius:999px;padding:1px 8px}
.themebar .tb{font-size:13.5px;color:#4B6640}
.pill.grey{background:var(--paper-2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.vote-btn{align-self:flex-start;border:1px solid var(--red);color:var(--red);padding:5px 14px;border-radius:999px;font-size:12.5px}
.vote-btn:disabled{border-color:var(--line);color:var(--muted)}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank .n{font-family:var(--serif);font-size:21px;color:var(--gold);width:24px}
.rank .g{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}

.q-box{border:1px solid var(--line);padding:15px 17px;border-radius:2px;margin-bottom:12px;background:var(--paper)}
.q-box p.qt{margin:0 0 10px;font-size:14.5px}
.q-box .src{font-size:12px;color:var(--gold);margin:0 0 4px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer;color:var(--ink);margin:0}
.opt input{margin-top:5px;accent-color:var(--red)}
.fb{margin-top:9px;font-size:13px;padding:9px 12px;border-radius:2px;background:var(--paper-2)}
.fb.ok{background:var(--gold-soft)}

.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.scrollx th,.scrollx td{white-space:nowrap}
.scrollx td:nth-child(3){width:100%}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--gold)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bark-2);color:#F2E7D2;
  padding:11px 20px;border-radius:2px;font-size:13.5px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw}
.busy{position:fixed;inset:0 0 auto 0;height:3px;background:var(--gold);z-index:70;animation:busy 1.1s linear infinite;transform-origin:left}
@keyframes busy{0%{transform:scaleX(0)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
.guide{max-width:70ch}
.mbar .reset{margin-top:8px;font-size:13px;color:var(--muted)}
.mbar .reset.soon{color:#8A1F12;background:#FDECEA;border:1px solid #E8B4AC;border-radius:8px;padding:6px 10px}
.lookcard{border:2px solid #2F6B3A;border-radius:12px;padding:12px 14px;margin:0 0 14px;background:#F2F8F2}
.lookcard .big{font-size:18px;font-weight:700}
.lookcard .ok{color:#2F6B3A;font-weight:700}.lookcard .no{color:#8A1F12;font-weight:700}
.who .guide-red,.guide-red{background:#B0301E!important;color:#fff!important;border-color:#B0301E!important;font-weight:700;font-size:15px;padding:7px 14px}
.who .bell.nt{background:#FFF3C9;color:#6B4228;border-color:#E5C46B}
.guidebanner{display:flex;align-items:center;gap:10px;background:#FDECEA;border:2px solid #B0301E;border-radius:12px;padding:10px 14px;margin:0 0 14px;color:#8A1F12}
.guidebanner b{font-size:16px}.guidebanner .btn{margin-left:auto;background:#B0301E;border-color:#B0301E;color:#fff}
.sguide .red{color:#B0301E;font-weight:700}
.sguide .redbox{border:2px solid #B0301E;background:#FDECEA;border-radius:12px;padding:10px 14px;margin:6px 0 12px}
.sguide .redbox h4{color:#B0301E;font-size:19px;margin:0 0 6px}
.hall{background:linear-gradient(135deg,#FFF6D8,#FBE7B8);border:1px solid #E5C46B;border-radius:14px;padding:12px 14px;margin:0 0 18px}
.hall h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 6px}
.hall h3 span{font-family:inherit;font-size:13px;color:var(--muted);margin-left:6px}
.hmon{font-size:12.5px;color:#8A5A00;font-weight:700;margin:8px 0 4px}
.hrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hcard{flex:0 0 min(240px,70vw);text-align:left;background:#fff;border:1px solid #EBD9A8;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit}
.hcard b{font-family:var(--serif);font-weight:400;font-size:16px}
.hcard span{font-size:13px;color:var(--muted)}
.hcard em{font-style:normal;font-size:12.5px;color:#8A5A00}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolepick .btn{padding:18px 0;font-size:18px}
.stafftag.club{background:#2F6B3A;color:#fff}
.desk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.desk-row .nm{flex:1;font-size:15px}
.desk-row .nm small{display:block;color:var(--muted);font-size:12.5px}
.desk-row .btn{min-width:108px}
.desk-sum{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:14px}
.desk-sum b{font-size:18px}
.bk .tag.qz{margin-left:6px;background:#2F6B3A;color:#fff;border-radius:999px;padding:1px 8px;font-weight:600}
.qbooks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:14px}
.qbooks b{background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600}
.sguide h4{margin:18px 0 4px}
.sguide ul{margin:4px 0}
.gseals{display:flex;gap:18px;margin:8px 0 6px}
.gseals div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted)}
.gseals .seal{height:46px;margin:0;transform:rotate(-6deg)}
.who .help{font-weight:600}
/* 별: 도장 5개마다 하나(누적) */
.starbadge{display:inline-flex;align-items:center;gap:3px;background:#F5D27A;color:#3A2A1E;border-radius:999px;padding:2px 9px 2px 7px;font-weight:700;font-size:13px}
.starbadge svg{width:15px;height:15px}
.stars{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:-4px 0 10px}
.stars svg{width:18px;height:18px}
.stars .sn{font-size:12.5px;color:var(--muted);margin-left:6px}
.stars .sx{font-family:var(--serif);font-size:15px;color:#9A7414;margin-left:2px}
.stars svg.pop{animation:starPop .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starPop{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.5) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
/* 오늘의 문장 */
.quote{position:relative;margin-top:18px;border-radius:14px;padding:16px 20px 14px 56px;background:linear-gradient(135deg,#FFF9EC,#F6EBD3);border:1px solid rgba(181,137,31,.3);overflow:hidden}
.quote::before{content:"“";position:absolute;left:14px;top:-6px;font:400 64px/1 'Gowun Batang',serif;color:rgba(158,59,36,.35)}
.quote .qk{font-size:12px;font-weight:600;letter-spacing:.06em;color:#9A7414}
.quote .qt{font-family:var(--soft);font-size:18px;line-height:1.6;margin:4px 0 6px;color:var(--ink);word-break:keep-all;text-wrap:balance}
.quote .qs{font-size:13px;color:var(--muted)}
body.role-staff .quote{background:#fff;border-color:var(--line);padding:12px 18px 10px 52px}
body.role-staff .quote .qt{font-size:16px}
body.role-staff .quote .qk{color:var(--gold)}
/* 친구들이 방금 쓴 글: 넓은 화면은 오른쪽 사이드바, 좁은 화면은 서가 탭 맨 위 카드 줄 */
.feed{display:none}
.feed h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 2px}
.feed .fsub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.fitem{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.fitem:hover{border-color:rgba(158,59,36,.35);background:#FFFDF8}
.fitem .fk{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.fitem .fk b{font-weight:600;color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.fk .k-label{background:#9E3B24}.fk .k-quote{background:#C9A227}.fk .k-review{background:#2B4C7E}
.fitem .ft{font-family:var(--serif);font-size:15px;line-height:1.35;color:#9E3B24;display:block}
.fitem .fx{font-family:var(--soft);font-size:13.5px;line-height:1.55;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.fitem .fm{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px}
.feed .more{width:100%;margin-top:4px}
@media (min-width:1100px){
  body:not(.role-staff) .wrap{max-width:1320px}
  body:not(.role-staff) .top-in{max-width:1320px}
  body:not(.role-staff) #app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0 28px;align-items:start}
  body:not(.role-staff) #app>*:not(.feed){grid-column:1}
  body:not(.role-staff) .feed{display:block;grid-column:2;grid-row:1 / span 8;position:sticky;top:14px;margin-top:18px;
    max-height:calc(100vh - 28px);overflow:auto;padding:14px 12px 10px;background:var(--paper-2);border-radius:14px}
  .feedstrip{display:none!important}
  .ntinline{display:none}
}
.notices{background:#FFF8E6;border:1px solid #E5C46B;border-radius:12px;padding:10px 12px;margin:0 0 16px}
.notices h3{font-family:var(--serif);font-weight:400;font-size:17px;margin:0 0 6px}
.notices ul{list-style:none;margin:0;padding:0}
.notices .ntc{padding:8px 0;border-top:1px dashed #E5C46B;display:flex;flex-direction:column;gap:3px;font-size:14px}
.notices .ntc:first-child{border-top:0;padding-top:2px}
.notices .ntc b{font-weight:700}
.notices .ntc.gift b{color:#8A5A00}
.notices .ntc em{font-style:normal;font-weight:600;color:#2F6B3A}
.notices .ntc small{color:var(--muted);font-size:12.5px}
.feedstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 0 16px;scrollbar-width:thin}
.feedstrip .fitem{flex:0 0 min(260px,78vw);margin:0;scroll-snap-align:start}
.stripH{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.stripH h4{font-family:var(--serif);font-weight:400;font-size:17px;margin:0}
/* 읽기 창 */
.reader{position:fixed;inset:0;z-index:80;background:rgba(30,22,16,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.reader .rbox{background:var(--paper);border-radius:16px;max-width:620px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:popin .25s ease both}
.reader .rtop{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.reader .rtop .x{margin-left:auto;font-size:22px;line-height:1;padding:4px 10px;border-radius:8px}
.reader .rtop .x:hover{background:var(--paper-2)}
.reader .rbody .card{border:0;padding:0;background:transparent}
.reader .rbody .rv{font-size:16px;line-height:1.9}
.reader .rnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.reader .rnav button,.reader .rnav .hint{white-space:nowrap}
.reader .rlike{display:flex;justify-content:center;margin-top:14px}
/* 게시판 */
.wallbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px}
.wallbar input{max-width:240px}
.wcard{cursor:pointer}
.wcard .rv{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
/* ── 교사 화면: 학생 화면과 영역이 다르게. 남색 관리 화면 + 넓은 화면에서는 왼쪽 세로 메뉴 ── */
body.role-staff{--paper:#F4F6F8;--paper-2:#E7ECF1;--ink:#1E2A36;--muted:#5B6B7B;--line:rgba(30,45,60,.15);
  --gold:#3A6EA5;--gold-soft:rgba(58,110,165,.12);--bark:#1F2E3D;--bark-2:#152029;--red:#B0452A;--red-soft:rgba(176,69,42,.1)}
body.role-staff .top{background:linear-gradient(90deg,#1F2E3D,#2A3F55)}
body.role-staff .top::after{background:radial-gradient(circle at 30% 70%,rgba(120,170,220,.18),transparent 62%)}
.who{flex-wrap:wrap;justify-content:flex-end}
.who>*{white-space:nowrap}
@media (max-width:560px){.who{margin-left:0;width:100%;justify-content:flex-start;gap:6px 8px}.who button{padding:5px 11px}}
.stafftag{font-size:11.5px;font-weight:700;letter-spacing:.08em;background:#F2E7D2;color:#1F2E3D;border-radius:4px;padding:2px 7px}
body.role-staff .board{background:#fff;border-color:var(--line)}
body.role-staff .news{background:#FFFBF0}
@media (min-width:1000px){
  body.role-staff .wrap{max-width:1200px}
  body.role-staff .top-in{max-width:1200px}
  body.role-staff #app{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 30px;align-items:start}
  body.role-staff #pvbar,body.role-staff #quote,body.role-staff #board{grid-column:1 / -1}
  body.role-staff .tabs{grid-column:1;flex-direction:column;gap:2px;border-bottom:0;border-right:1px solid var(--line);
    position:sticky;top:14px;margin-top:22px;padding:8px 10px 8px 0;overflow:visible;background:transparent}
  body.role-staff .tabs button{text-align:left;border-bottom:0;border-left:3px solid transparent;padding:10px 14px;margin:0;border-radius:0 8px 8px 0}
  body.role-staff .tabs button[aria-selected="true"]{border-left-color:var(--gold);background:var(--paper-2);color:var(--ink)}
  body.role-staff #panels{grid-column:2;padding-top:22px}
}
/* ── 학생: 이번 주 도장판(5칸) + 이번 달 막대(20칸) ── */
.giftbar.welcome{background:#FFF1DE;border-color:#E2B77A}
.giftbar.welcome .seal{height:40px;margin:0}
.bonus{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink);background:#FFF6DA;border-radius:10px;padding:7px 12px}
.bonus svg{width:26px;height:26px;flex:none}
.bonus b{font-family:var(--serif);font-weight:400;font-size:17px;color:#9A7414}
.mbar{margin-top:14px}
.mbar .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:6px}
.mbar .lab b{font-family:var(--serif);font-weight:400;font-size:19px}
.mbar .track{position:relative;display:grid;grid-template-columns:repeat(var(--cap),1fr);gap:3px}
.mbar .track i{height:12px;border-radius:3px;background:var(--line)}
.mbar .track i.on{background:linear-gradient(180deg,#C8742E,#9E3B24)}
.mbar .track i.gift{box-shadow:inset 0 0 0 2px #D9A93A}
.mbar .flag{font-size:11.5px;color:#9A7414;margin-top:4px}
.giftbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:linear-gradient(90deg,#FFF3C9,#FDE7B5);border:1px solid #E5C46B;
  border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.giftbar b{font-family:var(--serif);font-weight:400;font-size:18px}
.giftbar .end{margin-left:auto}
.giftbar>svg{width:30px;height:30px;flex:0 0 auto}
/* 상품권 표 */
.gtable td,.gtable th{white-space:nowrap}
.gtypes span{display:inline-block;width:20px;height:20px;border-radius:50%;color:#fff;font:700 11px/20px 'Gowun Batang',serif;text-align:center;margin-right:2px;opacity:.25}
.gtypes span.on{opacity:1}
.gtypes .t-label{background:#9E3B24}.gtypes .t-review{background:#2B4C7E}.gtypes .t-quiz{background:#2F6B3A}
/* 교사 알림 */
.news{border:1px solid rgba(181,137,31,.45);background:#FFFBF0;border-radius:12px;padding:12px 16px 14px;margin-bottom:16px}
.news .woong{margin-top:0}
.news ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.news li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline;font-size:14px}
.news li b.n{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--red);white-space:nowrap}
.news li small{display:block;color:var(--muted);font-size:12.5px;line-height:1.55}
.news .row{margin-top:12px}
.who .bell{position:relative}
.who .bell i{font-style:normal;background:#D9A93A;color:#271B12;border-radius:999px;padding:0 6px;margin-left:4px;font-size:11.5px;font-weight:700}
/* 독서 기록 */
.rlbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-bottom:12px}
.rlbar .f{display:flex;flex-direction:column}
.rlbar input[type=date],.rlbar select{width:auto;padding:7px 9px;font-size:15px}
.rltable td.books{min-width:260px;line-height:1.6}
.rltable td{vertical-align:top}
/* 가입 현황: 반마다 가입률 막대, 아직 안 들어온 학생 묶음 */
.jbar{display:inline-block;width:72px;height:8px;border-radius:5px;background:#EDE4D3;vertical-align:middle;overflow:hidden}
.jbar i{display:block;height:100%;background:#8A6A3B;border-radius:5px}
.jwait{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#FFFDF8}
.jwait>div{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
/* 내 서재 */
.mstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:14px 0 18px}
.mstat{background:var(--paper-2);border-radius:10px;padding:10px 12px}
.mstat b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.mstat span{font-size:12.5px;color:var(--muted)}
.bookshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 14px;padding:16px 14px 20px;
  background:linear-gradient(to bottom,transparent calc(100% - 10px),#C9A57A calc(100% - 10px));border-radius:4px}
.mbook{display:flex;flex-direction:column;gap:6px;text-align:left;padding:0;min-width:0}
.mbook .cv{position:relative;width:100%;aspect-ratio:3/4.3;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:2px 3px 8px rgba(43,35,32,.28);transition:transform .15s}
.mbook:hover .cv,.mbook[aria-pressed="true"] .cv{transform:translateY(-4px) rotate(-1deg)}
.mbook[aria-pressed="true"] .cv{outline:3px solid var(--gold);outline-offset:2px}
.mbook .cv img{width:100%;height:100%;object-fit:cover;display:block}
.mbook .spine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px;color:#FFF8EC;
  font-family:var(--serif);font-size:15px;line-height:1.3;text-align:center;word-break:keep-all;box-shadow:inset 6px 0 0 rgba(0,0,0,.12)}
.mbook .tt{font-size:13px;font-weight:600;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mbook .dots{display:flex;gap:4px;flex-wrap:wrap}
.mbook .dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot-label{background:#9E3B24}.dot-quote{background:#C9A227}.dot-review{background:#2B4C7E}.dot-quiz{background:#2F6B3A}
.qcard{position:relative;background:#FFFDF6;border:1px solid var(--line);border-left:4px solid #9E3B24;border-radius:12px;padding:14px 18px 13px}
.qcard .qmk{font-family:var(--serif);font-size:32px;line-height:.7;color:#C9A227}
.qcard .qtx{font-family:var(--serif);font-size:17px;line-height:1.75;margin:6px 0 10px;white-space:pre-wrap}
.qcard .qft{font-size:12.5px;color:var(--muted)}
.bcomic{font-size:12.5px;padding:3px 6px}
.ckline{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13.5px;color:var(--ink)}
.ckline input{width:16px;height:16px}
.seg3 button[disabled]{opacity:.45;cursor:not-allowed}
.seg3 button{flex:1;min-width:0;font-size:13px;padding:9px 6px}
.ltrack{display:inline-flex;gap:4px;align-items:center}
.ltrack i{width:14px;height:18px;border-radius:2px;border:1px solid #D8C79A;background:#FFF}
.ltrack i.on{background:#E0B43C;border-color:#B5891F}
.slot .sname{font-family:var(--serif);font-size:13px;color:var(--muted);display:block}
.xrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:#F7F3E8;border-radius:10px}
.xrow .xlab{font-family:var(--serif);font-size:13.5px;color:#8A6A2F}
.xrow .xs{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink)}
.xrow .xs svg{width:34px;height:34px}
.xrow .hint{flex:1 1 100%;margin:0}
.mdetail{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:16px}
.mdetail h4{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 2px}
.mitem{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px}
.qlog{width:100%;max-width:520px}
.qlog td,.qlog th{padding:7px 8px}
@media (max-width:560px){.bookshelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;padding:12px 8px 18px}.mbook .spine{font-size:13px}}
/* 추천 도서 안내 */
.recinfo{background:var(--paper-2);border-radius:12px;padding:14px 16px;margin:4px 0 16px;font-size:14px;line-height:1.7}
.recinfo h4{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 6px}
.recinfo ul{margin:6px 0 0;padding-left:18px}
.recinfo li{margin-bottom:3px}
.recinfo .dday{display:inline-block;font-family:var(--serif);background:var(--red);color:#fff;border-radius:999px;padding:0 10px;font-size:14px;margin-left:6px}
/* 웅이: 웅천(熊川)의 곰. 말풍선으로 안내 */
.woong{display:flex;align-items:flex-end;gap:10px;margin-top:12px}
.woong .bear{width:66px;flex:none}
.woong.big .bear{width:92px}
.woong .bear svg{display:block;width:100%;height:auto;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
.woong .bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.6;margin-bottom:10px}
.woong .bubble::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--paper);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.woong .bubble b.who{font-family:var(--serif);font-weight:400;color:#8B5A3C;margin-right:6px;font-size:15px}
.woong.cheer .bubble{background:var(--gold-soft);border-color:transparent}
.woong.cheer .bubble::before{background:#F4EAD2;border-color:transparent}
.woong .bear{cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.woong .bear:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.woong .bear.m-jump svg{animation:wjump .75s ease}
.woong .bear.m-wiggle svg{animation:wwiggle .8s ease}
.woong .bear.m-spin svg{animation:wspin .8s ease}
.woong .bear.m-nod svg{animation:wnod .7s ease 2}
@keyframes wjump{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}50%{transform:translateY(0)}68%{transform:translateY(-6px)}}
@keyframes wwiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-11deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes wspin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes wnod{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(4px) scaleY(.93)}}
.bubble .fresh-msg{display:block;font-weight:600;color:var(--ink)}
/* 새로 찍힌 도장: 쾅 */
.slot.new .seal{animation:stampIn .65s cubic-bezier(.2,1.5,.4,1) both}
.slot.new{animation:slotGlow 1.6s ease .3s both}
@keyframes stampIn{0%{transform:scale(2) rotate(-24deg);opacity:0}55%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes slotGlow{0%{box-shadow:0 0 0 0 rgba(217,169,58,.55)}100%{box-shadow:0 0 0 12px rgba(217,169,58,0)}}
/* 화면 어디서든 보이게 잠깐 떠오르는 웅이 */
.wpop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:65;width:min(380px,calc(100vw - 32px));animation:popin .4s cubic-bezier(.2,1.3,.4,1) both}
.wpop .woong{margin:0;filter:drop-shadow(0 8px 22px rgba(43,35,32,.22))}
.wpop .bubble{background:#FFFDF8}
.wpop.out{animation:popout .3s ease both}

다.", "공자, 『논어』", "명언"], ["군자는 말은 어눌하게 하고 행동은 민첩하게 하려 한다.", "공자, 『논어』", "명언"], ["뒤에 태어난 사람을 두려워할 만하다. 앞으로 올 사람이 지금의 우리만 못하리라고 어찌 알겠는가.", "공자, 『논어』", "명언"], ["아침에 도를 들으면 저녁에 죽어도 좋다.", "공자, 『논어』", "명언"], ["어진 사람을 보면 그와 같아지기를 생각하고, 어질지 못한 사람을 보면 속으로 나를 돌아본다.", "공자, 『논어』", "명언"], ["민첩하면서도 배우기를 좋아하고, 아랫사람에게 묻기를 부끄러워하지 않는다.", "공자, 『논어』", "명언"], ["분발하면 밥 먹는 것도 잊고, 즐거우면 근심도 잊어 늙음이 다가오는 줄도 모른다.", "공자, 『논어』", "명언"], ["지혜로운 사람은 물을 좋아하고, 어진 사람은 산을 좋아한다.", "공자, 『논어』", "명언"], ["나는 열다섯에 배움에 뜻을 두었다.", "공자, 『논어』", "명언"], ["옛날에 배우는 사람은 자기를 위해 공부했는데, 요즘 배우는 사람은 남에게 보이려고 공부한다.", "공자, 『논어』", "명언"], ["하늘이 장차 큰 일을 어떤 사람에게 맡기려 할 때는 반드시 먼저 그 마음과 뜻을 괴롭게 한다.", "맹자, 『맹자』", "명언"], ["남의 불행을 가엾게 여기는 마음은 어짊의 실마리다.", "맹자, 『맹자』", "명언"], ["하늘이 주는 때는 땅의 이로움만 못하고, 땅의 이로움은 사람의 화합만 못하다.", "맹자, 『맹자』", "명언"], ["스스로 돌이켜 보아 옳다면, 천만 명이 가로막아도 나는 가겠다.", "맹자, 『맹자』", "명언"], ["부귀도 마음을 어지럽히지 못하고, 가난도 뜻을 바꾸지 못하며, 위협도 지조를 굽히지 못하는 사람을 대장부라 한다.", "맹자, 『맹자』", "명언"], ["책을 모두 그대로 믿는다면 책이 없는 것만 못하다.", "맹자, 『맹자』", "명언"], ["가장 좋은 것은 물과 같다. 물은 만물을 이롭게 하면서도 다투지 않는다.", "노자, 『도덕경』", "명언"], ["남을 아는 사람은 지혜롭고, 자신을 아는 사람은 밝다.", "노자, 『도덕경』", "명언"], ["큰 그릇은 늦게 이루어진다.", "노자, 『도덕경』", "명언"], ["만족할 줄 아는 사람이 부유하다.", "노자, 『도덕경』", "명언"], ["남을 이기는 사람은 힘이 있고, 자신을 이기는 사람은 강하다.", "노자, 『도덕경』", "명언"], ["아는 사람은 말하지 않고, 말하는 사람은 알지 못한다.", "노자, 『도덕경』", "명언"], ["우물 안 개구리에게는 바다를 이야기할 수 없다.", "장자, 『장자』", "명언"], ["사람들은 모두 쓸모 있는 것의 쓸모는 알지만, 쓸모없는 것의 쓸모는 알지 못한다.", "장자, 『장자』", "명언"], ["장주가 꿈에 나비가 되었는지, 나비가 꿈에 장주가 되었는지 알 수 없다.", "장자, 『장자』", "명언"], ["반걸음이 쌓이지 않으면 천 리에 이를 수 없다.", "순자, 『순자』", "명언"], ["쑥이 삼밭에서 자라면 붙들어 주지 않아도 곧게 자란다.", "순자, 『순자』", "명언"], ["진실로 하루를 새롭게 하려거든, 날마다 새롭게 하고 또 날마다 새롭게 하라.", "『대학』", "명언"], ["마음이 거기 있지 않으면 보아도 보이지 않고, 들어도 들리지 않는다.", "『대학』", "명언"], ["남이 한 번에 할 수 있으면 나는 백 번을 하고, 남이 열 번에 할 수 있으면 나는 천 번을 한다.", "『중용』", "명언"], ["군자는 보이지 않는 곳에서도 삼가고, 들리지 않는 곳에서도 조심한다.", "『중용』", "명언"], ["궁하면 변하고, 변하면 통하고, 통하면 오래간다.", "『주역』", "명언"], ["옥은 다듬지 않으면 그릇이 되지 못하고, 사람은 배우지 않으면 도리를 알지 못한다.", "『예기』", "명언"], ["배운 뒤에야 부족함을 알고, 가르쳐 본 뒤에야 어려움을 안다. 가르치고 배우며 함께 자란다.", "『예기』", "명언"], ["복숭아나무와 자두나무는 말이 없어도 그 아래에 저절로 길이 생긴다.", "사마천, 『사기』", "명언"], ["사람은 누구나 한 번 죽지만, 어떤 죽음은 태산보다 무겁고 어떤 죽음은 기러기 털보다 가볍다.", "사마천, 「보임안서」", "명언"], ["적을 알고 나를 알면 백 번 싸워도 위태롭지 않다.", "손자, 『손자병법』", "명언"], ["도가 있는 곳에 스승이 있다.", "한유, 「사설」", "명언"], ["사내라면 모름지기 다섯 수레의 책을 읽어야 한다.", "두보", "명언"], ["대나무를 그리려면 먼저 가슴속에 대나무가 있어야 한다.", "소식", "명언"], ["한창때는 다시 오지 않고, 하루에 새벽은 두 번 오지 않는다. 세월은 사람을 기다려 주지 않는다.", "도연명, 「잡시」", "명언"], ["담박하지 않으면 뜻을 밝힐 수 없고, 고요하지 않으면 멀리 이를 수 없다.", "제갈량, 「계자서」", "명언"], ["미움은 미움으로 그치지 않는다. 미움은 오직 미움을 버릴 때 그친다.", "『법구경』", "명언"], ["소리에 놀라지 않는 사자처럼, 그물에 걸리지 않는 바람처럼, 진흙에 더럽혀지지 않는 연꽃처럼, 무소의 뿔처럼 혼자서 가라.", "『숫타니파타』", "책 속 한 줄"], ["희망이란 본래 있다고도 할 수 없고 없다고도 할 수 없다. 그것은 땅 위의 길과 같다. 걸어가는 사람이 많아지면 그것이 곧 길이 된다.", "루쉰, 「고향」", "책 속 한 줄"], ["사람이 이 세상에 태어나서 학문을 하지 않으면 사람다운 사람이 될 수 없다.", "이이, 『격몽요결』", "명언"], ["처음 배우는 사람은 먼저 뜻을 세워야 한다.", "이이, 『격몽요결』", "명언"], ["독서야말로 사람이 할 수 있는 첫째가는 깨끗한 일이다.", "정약용, 두 아들에게 보낸 편지", "명언"], ["청렴은 목민관의 본분이요, 모든 선의 근원이며 모든 덕의 뿌리다.", "정약용, 『목민심서』", "명언"], ["옛것을 본받되 변할 줄 알고, 새것을 만들되 법도에 맞게 하라.", "박지원, 「초정집서」", "명언"], ["훌륭한 울음터로다. 한바탕 울어 볼 만하구나!", "박지원, 『열하일기』", "책 속 한 줄"], ["백성은 나라의 근본이니, 근본이 튼튼해야 나라가 편안하다.", "『서경』", "명언"], ["새로 스물여덟 자를 만드니, 사람마다 쉽게 익혀 날마다 쓰기에 편하게 하고자 할 따름이다.", "세종, 『훈민정음』 서문", "책 속 한 줄"], ["지난 일을 거울삼아 뒤에 올 환란을 대비한다.", "유성룡, 『징비록』", "책 속 한 줄"], ["신에게는 아직 열두 척의 배가 있습니다.", "이순신", "명언"], ["바다에 맹세하니 물고기와 용이 움직이고, 산에 맹세하니 풀과 나무가 알아준다.", "이순신, 「진중음」", "명언"], ["이익을 보면 의로움을 생각하고, 나라가 위태로우면 목숨을 바친다.", "안중근, 옥중 유묵", "명언"], ["낙망은 청년의 죽음이요, 청년이 죽으면 민족이 죽는다.", "안창호", "명언"], ["진리는 반드시 따르는 자가 있고, 정의는 반드시 이루는 날이 있다.", "안창호", "명언"], ["나는 우리나라가 남의 것을 모방하는 나라가 되지 말고, 높고 새로운 문화의 근원이 되고 모범이 되기를 원한다.", "김구, 「나의 소원」", "명언"], ["눈 덮인 들판을 걸어갈 때 함부로 어지러이 걷지 마라. 오늘 내가 걸어간 발자국은 뒷사람의 이정표가 되리니.", "이양연, 「야설」(김구가 즐겨 쓴 시)", "책 속 한 줄"], ["장부가 집을 나서면 살아서 돌아오지 않는다.", "윤봉길", "명언"], ["어린이를 내려다보지 마시고 쳐다보아 주십시오.", "방정환, 「어른들에게 드리는 글」", "명언"], ["말이 오르면 나라도 오르고, 말이 내리면 나라도 내린다.", "주시경", "명언"], ["나에게 대학생 친구가 하나 있었으면 원이 없겠다.", "전태일", "명언"], ["가장 먼 여행은 머리에서 가슴까지의 여행이다.", "신영복", "명언"], ["우리는 필요에 의해서 물건을 갖지만, 때로는 그 물건 때문에 마음을 쓰게 된다.", "법정, 『무소유』", "책 속 한 줄"], ["태산이 높다 하되 하늘 아래 뫼이로다. 오르고 또 오르면 못 오를 리 없건마는 사람이 제 아니 오르고 뫼만 높다 하더라.", "양사언", "책 속 한 줄"], ["오백 년 도읍지를 필마로 돌아드니 산천은 의구하되 인걸은 간 데 없다.", "길재", "책 속 한 줄"], ["이 몸이 죽고 죽어 일백 번 고쳐 죽어 백골이 진토 되어 넋이라도 있고 없고 임 향한 일편단심이야 가실 줄이 있으랴.", "정몽주, 「단심가」", "책 속 한 줄"], ["동짓달 기나긴 밤을 한 허리를 베어 내어 춘풍 이불 아래 서리서리 넣었다가.", "황진이", "책 속 한 줄"], ["내 벗이 몇이나 하니 수석과 송죽이라.", "윤선도, 「오우가」", "책 속 한 줄"], ["아버지를 아버지라 부르지 못하고, 형을 형이라 부르지 못하니.", "허균, 『홍길동전』", "책 속 한 줄"], ["제비 한 마리가 왔다고 봄이 되는 것은 아니다.", "아리스토텔레스, 『니코마코스 윤리학』", "명언"], ["인간은 본성적으로 정치적 동물이다.", "아리스토텔레스, 『정치학』", "명언"], ["너 자신을 알라.", "델포이 신전의 경구(소크라테스가 즐겨 인용)", "명언"], ["같은 강물에 두 번 들어갈 수는 없다.", "헤라클레이토스", "명언"], ["사람을 괴롭히는 것은 일 그 자체가 아니라, 그 일에 대한 생각이다.", "에픽테토스, 『엥케이리디온』", "명언"], ["좋은 사람이란 어떤 사람인지 더 이상 논하지 말고, 좋은 사람이 되어라.", "마르쿠스 아우렐리우스, 『명상록』", "명언"], ["우리에게 주어진 시간이 짧은 것이 아니라, 우리가 많은 시간을 허비하는 것이다.", "세네카, 『인생의 짧음에 관하여』", "명언"], ["나는 무엇을 아는가?", "몽테뉴, 『수상록』", "명언"], ["독서는 충실한 사람을, 토론은 준비된 사람을, 글쓰기는 정확한 사람을 만든다.", "프랜시스 베이컨, 『수상록』", "명언"], ["아는 것이 힘이다.", "프랜시스 베이컨", "명언"], ["마음은 이성이 알지 못하는 나름의 이유를 가지고 있다.", "파스칼, 『팡세』", "명언"], ["모든 고귀한 것은 드문 만큼 어렵다.", "스피노자, 『에티카』", "명언"], ["생각할수록 새롭고 커지는 감탄과 경외로 마음을 채우는 두 가지가 있다. 내 위의 별이 빛나는 하늘과 내 안의 도덕 법칙이다.", "칸트, 『실천이성비판』", "명언"], ["감히 알려고 하라! 너 자신의 지성을 사용할 용기를 가져라.", "칸트, 「계몽이란 무엇인가」", "명언"], ["인간은 자유롭게 태어났으나 어디서나 사슬에 묶여 있다.", "루소, 『사회계약론』", "명언"], ["만족한 돼지보다 불만족한 인간이 낫고, 만족한 바보보다 불만족한 소크라테스가 낫다.", "존 스튜어트 밀, 『공리주의』", "명언"], ["단 한 사람만 다른 의견을 가졌더라도, 인류가 그 한 사람을 침묵시킬 권리는 없다.", "존 스튜어트 밀, 『자유론』", "명언"], ["나를 죽이지 못하는 것은 나를 더 강하게 만든다.", "니체, 『우상의 황혼』", "명언"], ["왜 살아야 하는지 아는 사람은 그 어떤 상황도 견딜 수 있다.", "니체(빅터 프랭클 『죽음의 수용소에서』 인용)", "명언"], ["인생은 뒤돌아볼 때 이해되지만, 앞을 향해 살아야 한다.", "키르케고르, 일기", "명언"], ["인간은 자유롭도록 선고받았다.", "사르트르, 『실존주의는 휴머니즘이다』", "명언"], ["사랑은 '빠지는' 것이 아니라 '참여하는' 것이다.", "에리히 프롬, 『사랑의 기술』", "책 속 한 줄"], ["그는 어리석지 않았다. 그를 그 시대의 가장 큰 범죄자로 만든 것은 순전한 생각 없음이었다.", "한나 아렌트, 『예루살렘의 아이히만』", "책 속 한 줄"], ["여자는 태어나는 것이 아니라 만들어지는 것이다.", "시몬 드 보부 /* 공백이 아닌 글자인가(트림이 떼어 내는 것들만 뺀다) */
function NSP(c){return c>32&&c!==160&&c!==0x1680&&(c<0x2000||c>0x200A)&&c!==0x2028&&c!==0x2029&&c!==0x202F&&c!==0x205F&&c!==0x3000&&c!==0xFEFF;}
/* 값을 글자열로. 한 번 부르는 값은 싸지만 한 화면에 수백만 번 불리므로,
   앞뒤에 공백이 없으면 자르지 않고 그대로 돌려준다(새 글자열을 만들지 않는다) */
function S(v){
  if(typeof v==="string"){var n=v.length;if(!n)return v;
    if(NSP(v.charCodeAt(0))&&NSP(v.charCodeAt(n-1)))return v;
    return v.trim();}
  return v==null?"":String(v).trim();
}
function p2(n){return (n<10?"0":"")+n;}
function kst(d){return new Date(d.getTime()+9*3600000);}
function ymd(k){return k.getUTCFullYear()+"-"+p2(k.getUTCMonth()+1)+"-"+p2(k.getUTCDate());}
function today(d){return ymd(kst(d));}
/* 그 주 월요일 날짜. shift 는 주 단위 이동 */
function weekKey(d,shift){
  var k=kst(d),dow=(k.getUTCDay()+6)%7;
  return ymd(new Date(k.getTime()-dow*86400000+(shift||0)*7*86400000));
}

function norm(s){return S(s).replace(/[\s·,.'"“”‘’\-–—()\[\]:;!?『』「」<>]/g,"").toLowerCase();}
function hashInt(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(list,seed){

function make(db,env){

  function giftWindows(c){

  /* 요청 여러 개를 25개씩 나눠 보낸다(독서로에 한꺼번에 몰리지 않게) */
  function httpAll(reqs){
    var out=[];
    for(var i=0;i<reqs.length;i+=25){

  }

  function libLookup(items,withState,maxPer){

  /* 추천 도서 전체(또는 ids)를 독서로와 맞춰 도서 시트에 적는다 */

  /* 이번 달 추천 도서: 학교 장서의 대분류(장르)마다 2권 안팎, 모두 합쳐 이달의권수(40)권.

  function genreQuota(total){

  /* 영역별 몫: 40권 기준 몫을 권수에 맞춰 늘이거나 줄인다 */
  function teenQuota(total){
    var q={},sum=0;TEEN_AREAS.forEach(function(a){q[a[0]]=Math.floor(a[1]*total/40);sum+=q[a[0]];});
    for(var i=0;sum<total;i++,sum++)q[TEEN_AREAS[i%TEEN_AREAS.length][0]]++;

  function pickTeen(mon,total,used,series){

    db.rows("권장도서").forEach(function(r){

      var t=shownTitle(r["제목"]),ar=S(r["영역"]);if(TEEN_NAMES.indexOf(ar)<0)ar="인문";
      (by[ar]=by[ar]||[]).push({t:t,a:shownAuthor(r["지은이"]),area:ar,src:S(r["출처"]),n:Number(r["권수"])||0,pub:S(r["출판사"]),year:S(r["발행년"]),isbn:S(r["ISBN"]).slice(0,13),call:S(r["청구기호"])});

    var todo=books.filter(function(b){return !had[tkey(b.t)];});
    if(!todo.length)return 0;
    var F=qFactory(books,"bank|"+mon),out=[],seen={};
    rows.forEach(function(q){seen[norm(q["문제"])]=1;});
    todo.forEach(function(b,i){
      ["about","keyword","author",i%2?"call":"kdc"].forEach(function(k){
        var x=F.build(b,k);if(!x||seen[norm(x.q)])return;seen[norm(x.q)]=1;

  /* 미리 만들어 둔 문제를 시트에서 지운다.
     - 다음 달치로 미리 만들어 둔 자동 문제 은행(상태 예비)
     - 아직 오지 않은 주에 걸린 출제 문제
     학생이 낸 문제(대기)와 지난 기록은 건드리지 않는다. */
  function dropPreMade(){
    var mon=S(conf()["이달"]),wk=weekKey(env.now(),0),n=0;
    var keep=db.rows("퀴즈").filter(function(q){
      var st=S(q["상태"]);
      if(st==="예비"&&S(q["출처"])==="자동"&&mon&&S(q["월"])&&S(q["월"])>mon){n++;return false;}
      return true;
    });
    if(n)db.replace("퀴즈",keep);
    return n;
  }
  function ensureWeeklyQuiz(){
    try{dropPreMade();}catch(e){}
    var c=conf(),now=env.now(),wk=weekKey(now,0),target=Number(c["퀴즈문항수"])||5,bar=Number(c["퀴즈품질기준"])||6;
    var maxB=Number(c["퀴즈책수"])||3,mon=S(c["이달"]);
    /* 같은 주에 같은 문제가 두 번 이상 출제돼 있으면 하나만 남긴다 */
    var rows=db.rows("퀴즈"),seenQ={},dup={};
    rows.forEach(function(q){
      if(S(q["상태"])!=="출제"||!S(q["주"]))return;
      var k=S(q["주"])+"|"+norm(q["문제"]);
      if(seenQ[k])dup[S(q["id"])]={"상태":"중복"};else seenQ[k]=true;
    });
    if(Object.keys(dup).length){db.setMany("퀴즈","id",dup);rows=db.rows("퀴즈");}
    var live=rows.filter(function(q){return S(q["상태"])==="출제"&&S(q["주"])===wk;});
    var need=target-live.length;if(need<=0)return {added:0,week:wk,books:weekBooksOf(wk)};
    if(mon){try{buildBank(mon);}catch(e){}rows=db.rows("퀴즈");}
    var keys=shelfKeys();
    /* 이번 주 퀴즈 책(최대 maxB권): 이미 출제된 책 → 품질 좋은 학생 문제가 있는 책 → 은행 문제가 있는 책(아직 안 나온 책, 다른 장르 먼저) */
    var wb={},books=[],genres={};
    function addB(t){var k=tkey(t);if(wb[k])return true;if(books.length>=maxB)return false;wb[k]=1;books.push(S(t));var b=keys[k];if(b)genres[b.s]=1;return true;}
    live.forEach(function(q){var k=tkey(q["책제목"]);if(!wb[k]){wb[k]=1;books.push(S(q["책제목"]));var b=keys[k];if(b)genres[b.s]=1;}});
    var usedStu={};live.forEach(function(q){if(S(q["학번"]))usedStu[S(q["학번"])]=1;});
    var cand=rows.filter(function(q){return S(q["상태"])==="대기"&&S(q["출처"])!=="자동"&&(Number(q["품질"])||0)>=bar&&onShelf(q["책제목"],keys);})
      .sort(function(x,y){return (Number(y["품질"])||0)-(Number(x["품질"])||0)||(S(x["시각"])<S(y["시각"])?-1:1);});
    cand.forEach(function(q){if(!(S(q["학번"])&&usedStu[S(q["학번"])]))addB(q["책제목"]);});
    var usedBefore={};
    rows.forEach(function(q){if(S(q["상태"])==="출제"&&S(q["주"])&&S(q["주"])!==wk){var k=tkey(q["책제목"]);usedBefore[k]=(usedBefore[k]||0)+1;}});
    var bankBy={};
    rows.forEach(function(q){if(S(q["상태"])==="예비"&&S(q["월"])===mon&&onShelf(q["책제목"],keys))(bankBy[tkey(q["책제목"])]=bankBy[tkey(q["책제목"])]||[]).push(q);});
    /* 책 내용을 묻는 문제(소개글·핵심어)가 있는 책을 먼저 */
    function content(k){return (bankBy[k]||[]).filter(function(q){var x=qKind(q);return x==="about"||x==="keyword";}).length;}
    var copies={};db.rows("도서").forEach(function(b){if(S(b["월"])===mon&&S(b["숨김"])!=="Y")copies[tkey(b["제목"])]=Number(b["권수"])||0;});
    var order=shuffle(Object.keys(bankBy).sort(),wk+"|books").sort(function(x,y){return (usedBefore[x]||0)-(usedBefore[y]||0)||(copies[y]||0)-(copies[x]||0)||(content(x)?0:1)-(content(y)?0:1);});
    /* 부수 많은 책부터: 5권 이상 → 3~4권 → 나머지 묶음마다 세 바퀴(내용 문제·장르 다양) */
    function tier(k){var n=copies[k]||0;return n>=5?0:n>=3?1:2;}
    [0,1,2].forEach(function(ti){[[true,true],[true,false],[false,false]].forEach(function(p){
      order.forEach(function(k){
        if(books.length>=maxB||wb[k]||tier(k)!==ti)return;
        var b=keys[k],g=b?b.s:"";
        if(p[0]&&!content(k))return;          /* 1·2바퀴: 내용 문제가 있는 책만 */
        if(p[1]&&genres[g])return;            /* 1바퀴: 장르도 겹치지 않게 */
        addB(bankBy[k][0]["책제목"]);
      });
    });});
    /* ① 학생 문제(한 학생 한 문제) */
    var per={},fromStu=0,fromBank=0,made=0,upd={};
    live.forEach(function(q){var k=tkey(q["책제목"]);per[k]=(per[k]||0)+1;});
    cand.forEach(function(q){
      if(need<=0)return;
      var k=tkey(q["책제목"]),st=S(q["학번"]);
      if(!wb[k]||(st&&usedStu[st]))return;
      if(st)usedStu[st]=1;
      upd[S(q["id"])]={"상태":"출제","주":wk,"차수":c["차수"]};per[k]=(per[k]||0)+1;need--;fromStu++;
    });
    /* ② 은행 문제: 책마다 고르게, 종류는 소개글 → 핵심어 → 지은이 → 청구기호 순 */
    var PR={about:0,keyword:1,author:2,call:3,kdc:3};
    Object.keys(bankBy).forEach(function(k){bankBy[k].sort(function(x,y){var a=PR[qKind(x)],b=PR[qKind(y)];return (a==null?9:a)-(b==null?9:b);});});
    /* 청구기호·분야(도서관 활용) 문제는 한 주에 하나까지 */
    var libN=live.filter(function(q){var x=qKind(q);return x==="call"||x==="kdc";}).length;
    books.forEach(function(t){var k=tkey(t);if(bankBy[k])bankBy[k]=bankBy[k].filter(function(q,i,a){var x=qKind(q);return !(x==="call"||x==="kdc")||a.indexOf(q)===a.findIndex(function(z){var y=qKind(z);return y==="call"||y==="kdc";});});});
    while(need>0){
      var pickK=null;
      books.forEach(function(t){var k=tkey(t);
        var avail=(bankBy[k]||[]).filter(function(q){var x=qKind(q);return libN<1||!(x==="call"||x==="kdc");});
        if(avail.length&&(pickK===null||(per[k]||0)<(per[pickK]||0)))pickK=k;});
      if(pickK===null)break;
      var qi=bankBy[pickK].findIndex(function(q){var x=qKind(q);return libN<1||!(x==="call"||x==="kdc");}),q=bankBy[pickK].splice(qi,1)[0];
      if(qKind(q)==="call"||qKind(q)==="kdc")libN++;
      upd[S(q["id"])]={"상태":"출제","주":wk,"차수":c["차수"]};per[pickK]=(per[pickK]||0)+1;need--;fromBank++;
    }
    if(Object.keys(upd).length)db.setMany("퀴즈","id",upd);
    /* ③ 은행이 모자라면 그 자리에서 만든다(같은 책들로, 이미 있는 문제와 겹치지 않게) */
    if(need>0&&mon){
      var pb=periodBooks(mon),F=qFactory(pb,wk),have={},out=[];
      db.rows("퀴즈").forEach(function(q){have[norm(q["문제"])]=1;});
      pb.filter(function(b){return wb[tkey(b.t)];}).forEach(function(b){
        BANK_KINDS.forEach(function(k){
          if(need<=0)return;
          var x=F.build(b,k);if(!x||have[norm(x.q)])return;have[norm(x.q)]=1;
          out.push(qRow(b,k,x,wk,{"상태":"출제","주":wk,"월":mon}));need--;made++;

  }
  /* 그 주 퀴즈에 나온 책들 */

  /* 매일 세 번(7시·15시·0시) 도는 일: 달이 바뀌었으면 이번 달 추천 도서를 새로 뽑고, 보이는 책의 대출 상태를 새로 받는다 */
  /* 독서로 연결 확인: 분류 조회 한 건. 응답이 오고 책이 한 권이라도 있어야 '된다'고 본다 */
  function libProbe(){
    var r=httpAll([libCatReq(libConf(),"001000000",1)])[0],d=libData(r);
    if(!r)return {ok:false,why:"독서로에 연결되지 않음(응답 없음)"};
    if(!d)return {ok:false,why:"독서로가 오류를 돌려줌(코드 "+r.code+")"};
    if(!(d.totalCount>0))return {ok:false,why:"응답은 오지만 책이 0권 — 학교코드·교육청코드를 확인하세요"};
    return {ok:true,count:d.totalCount};
  }
  function libAlive(){return libProbe().ok;}
  /* 학교 장서 전체(독서로): 대분류마다 모든 쪽을 받아 같은 책(종)끼리 묶어 '장서목록' 시트에. 하나라도 못 받으면 덮어쓰지 않는다 */
  function crawlCatalog(){
    if(!db.replace)return null;
    var d=libData(httpAll([{url:LIB+"/alpasq/api/category/list?type=B",method:"get"}])[0]);
    var L=libConf(),cats=(d&&d.categoryList||[]).map(function(x){return {code:S(x.lCategoryCode)};}).filter(function(x){return x.code;});
    if(!cats.length)return {failed:true};
    var first=httpAll(cats.map(function(x){return libCatReq(L,x.code,1);})).map(libData),reqs=[],own=[];
    if(first.some(function(x){return !x;}))return {failed:true};
    first.forEach(function(r,i){var pages=Math.ceil((r.totalCount||0)/50);for(var pg=2;pg<=pages;pg++){reqs.push(libCatReq(L,cats[i].code,pg));own.push(i);}});
    var rest=httpAll(reqs).map(libData);
    if(rest.some(function(x){return !x;}))return {failed:true};
    var by={},n=0;
    function take(list){(list||[]).forEach(function(b){
      n++;var k=S(b.speciesKey)||(norm(b.title)+"|"+norm(b.author)),o=by[k];
      if(!o)o=by[k]={t:S(b.title),a:S(b.author),pub:S(b.publisher),year:S(b.pubYear),calls:{},n:0,cat:S(b.categoryInfo&&b.categoryInfo.ldesc),mid:S(b.categoryInfo&&b.categoryInfo.mdesc),isbn:S(b.isbn).slice(0,13),loc:S(b.locationName)};
      o.n++;var cn=S(b.callNo).replace(/\s+c\.\s*\d+\s*$/i,"");o.calls[cn]=(o.calls[cn]||0)+1;});}
    first.forEach(function(r){take(r.bookList);});
    rest.forEach(function(r){take(r.bookList);});
    var rows=Object.keys(by).map(function(k){var o=by[k],cn=Object.keys(o.calls).sort(function(x,y){return o.calls[y]-o.calls[x];})[0]||"";
      return {"제목":o.t,"지은이":o.a,"출판사":o.pub,"발행년":o.year,"청구기호":cn,"권수":o.n,"분야":o.cat,"중분류":o.mid,"ISBN":o.isbn,"자료실":o.loc};})
      .sort(function(x,y){return x["청구기호"]<y["청구기호"]?-1:x["청구기호"]>y["청구기호"]?1:0;});
    var was=Number(conf()["장서"])||0;
    db.replace("장서목록",rows);
    setConf("장서",String(n));setConf("장서종",String(rows.length));setConf("장서목록일",today(env.now()));
    var diff=was?n-was:0;
    setConf("장서변화",today(env.now())+" · "+n+"권"+(was?(diff>0?" (지난번보다 +"+diff+"권 늘었습니다)":diff<0?" ("+(-diff)+"권 줄었습니다)":" (지난번과 같습니다)"):""));
    return {copies:n,titles:rows.length,diff:diff};
  }
  function libCount(){

  /* 목록에 없는 책으로 쓴 글의 청구기호·표지를 나중에 채운다(제출할 때 기다리지 않게). 표지 "-" = 찾아봤지만 없음 */

    if(r&&r.picked)try{renewWeekAuto();}catch(e){}
    /* 퀴즈판 3(2026-09-20): 이번 주 문제를 부수 많은 책에서 한 번 다시 낸다 */

    setConf("퀴즈판","4");
    /* 퀴즈는 청구기호를 받아 온 뒤에 채운다(첫 실행에서도 자동 문제가 나오게) */

  /* 도서 검색: 학교 도서관 소장 도서를 찾아 같은 책끼리 묶고 대출 가능 여부를 붙인다(10분 보관) */
  function libSearch(a,p){
    var q=S(p.q).slice(0,60);
    if(!q)fail("찾을 책 제목이나 지은이를 입력해 주세요.");
    var key="lib|"+norm(q),hit=env.cacheGet?env.cacheGet(key):null;
    if(hit)return JSON.parse(hit);
    var L=libConf(),d=libData(httpAll([libSearchReq(L,q,1)])[0]);
    if(!d)fail("독서로가 응답하지 않습니다. 잠시 뒤 다시 찾아 주세요.");
    var groups=[],by={};
    (d.bookList||[]).forEach(function(b){
      var k=S(b.speciesKey)||(norm(b.title)+"|"+norm(b.author));
      if(!by[k]){by[k]={t:shownTitle(b.title)||S(b.title),full:S(b.title),a:shownAuthor(b.author),pub:S(b.publisher),year:S(b.pubYear),
        cat:S(b.categoryInfo&&(b.categoryInfo.mdesc||b.categoryInfo.ldesc)),copies:[],loc:S(b.locationName)};groups.push(by[k]);}
      by[k].copies.push(b);
    });
    groups=groups.slice(0,12);
    var reqs=[],owner=[];
    groups.forEach(function(g,i){g.copies.slice(0,6).forEach(function(b){reqs.push(libStateReq(L,b.bookKey));owner.push(i);});});
    var st=httpAll(reqs);
    groups.forEach(function(g){g.checked=0;g.avail=0;g.due="";g.cover="";});
    st.forEach(function(r,k){
      var g=groups[owner[k]],x=libData(r);if(!x)return;
      g.checked++;if(!g.cover&&S(x.coverUrl))g.cover=S(x.coverUrl);
      if(S(x.status)==="대출가능")g.avail++;
      else if(S(x.returnPlanDate)&&(!g.due||S(x.returnPlanDate)<g.due))g.due=S(x.returnPlanDate);
    });
    var out={q:q,total:d.totalCount||0,items:groups.map(function(g){
      return {t:g.t,full:g.full,a:g.a,pub:g.pub,year:g.year,cat:g.cat,loc:g.loc,call:callNoOf(g.copies),
        total:g.copies.length,checked:g.checked,avail:g.avail,due:g.due,cover:g.cover};})};
    if(env.cachePut)try{env.cachePut(key,JSON.stringify(out),600);}catch(e){}

  var COMIC_OK=["쥐","마우스","페르세폴리스","풀","송곳","미생","습지생태보고서","100도씨","100℃",

  function revokeAcc(acc,keepHash){

  function staff(a){if(a.role!=="admin"&&a.role!=="teacher")fail("교사만 할 수 있습니다.");}

  function pinLen(){var n=Number(conf()["핀자릿수"])||6;return Math.min(8,Math.max(4,n));}

  /* 잠금: 실패 5회 → 10분, 10회 → 하루. 선생님이 계정 관리에서 풀 수 있습니다 */
  function lockLeft(row){

  function pinFail(sheet,keyCol,keyVal,row){

  /* 학생: 학번+이름 → (처음이면) 동의 → PIN 정하기 → 들어가기 / (다음부터) 학번+PIN */
  function login(p){

    if(S(r["이메일"]))fail("이 학번은 이미 다른 계정으로 등록돼 있습니다. 담임 선생님께 알려 주세요.");
    if(p.agree!==true)fail("개인정보 수집·이용에 동의해야 참여할 수 있습니다.");
    db.set("명단","학번",id,{"이메일":a.email,"동의":stamp(env.now())});
    return {ok:true};
  }

  /* ── 글 ── */
  function posted(r){return S(r["상태"])==="posted";}
  function tally(){
    var m={};db.rows("반응").forEach(function(v){if(S(v["갈래"])!=="투표")return;var k=S(v["글id"]);m[k]=(m[k]||0)+1;});return m;
  }
  function pub(r){
    return {id:S(r["id"]),kind:S(r["종류"]),title:S(r["책제목"]),author:S(r["지은이"]),cls:S(r["반"]),
      head:S(r["머리글"]),text:S(r["본문"]),date:S(r["시각"]).slice(0,10),call:S(r["청구기호"]),won:S(r["수상"])==="Y",honor:S(r["명예"]),
      by:S(r["반"])===TEACHER_CLS?S(r["이름"])+" 선생님":""};
  }
  function likeKey(me,id){return env.hmac("like|"+me+"|"+id);}
  function likeCount(){var m={};db.rows("반응").forEach(function(v){if(S(v["갈래"])!=="공감")return;var k=S(v["글id"]);m[k]=(m[k]||0)+1;});return m;}
  function full(r,votes){
    var o=pub(r);
    o.name=S(r["이름"]);o.hakbun=S(r["학번"]);o.status=S(r["상태"]);o.memo=S(r["메모"]);
    o.why=S(r["계기"]);o.page=S(r["쪽수"]);o.week=S(r["주"]);
    o.printed=S(r["인쇄"])==="Y";o.won=S(r["수상"])==="Y";o.seen=S(r["확인"])==="Y";
    o.votes=votes?(votes[o.id]||0):0;
    return o;
  }
  function byNew(a,b){return S(b["시각"])<S(a["시각"])?-1:1;}

  /* 투표 후보: 올라온 날부터 이레(VOTE_DAYS) 안의 글. 내 글과 선생님 글은 빼고 */
  function voteFrom(now){return addDays(today(now),-(VOTE_DAYS-1));}
  function inVoteWindow(r,now){var d=S(r["시각"]).slice(0,10);return d>=voteFrom(now)&&d<=today(now);}
  function cands(kind,me,now,c){
    var n=Number(c["투표후보수"])||8;
    var pool=db.rows("글").filter(function(r){
      return posted(r)&&writeKind(r["종류"])===kind&&inVoteWindow(r,now)&&S(r["학번"])!==me&&S(r["반"])!==TEACHER_CLS;});
    pool.sort(function(a,b){return S(a["id"])<S(b["id"])?-1:1;});
    return shuffle(pool,me+"|"+weekKey(now,0)+"|"+kind).slice(0,n);
  }
  function voterKey(me,wk,kind){return env.hmac("vote|"+me+"|"+wk+"|"+kind);}
  /* 이번 주에 내가 뽑은 글들(부문마다 최대 VOTE_PER_WEEK 표) */
  function myVotes(me,wk,kind){
    var vk=voterKey(me,wk,kind);
    return db.rows("반응").filter(function(x){return S(x["갈래"])==="투표"&&S(x["누구"])===vk;}).map(function(x){return S(x["글id"]);});
  }

  /* ── 도장 ──
     한 주(월~일)에 주간도장(5)개. 칸이 종류별로 정해져 있는 것이 아니라, 종류마다 한 주 상한이 있다.
       · 라벨·문장 — 둘을 합쳐 한 주 주간라벨문장(1)개
       · 독후감     — 한 주 주간독후감(2)개 (이 주의 주제·추천 도서 덤 도장이 여기 들어간다)
       · 퀴즈       — 출제와 풀이를 합쳐 한 주 주간퀴즈(2)개
       · 만능       — 책갈피 다섯 장, 선생님 도장, 이달의 부문 3위 상. 종류 상한이 없어 어느 자리든 채우고, 넘치면 다음 주로
     1 + 2 + 2 = 5 이므로, 다섯 칸을 다 채우면 라벨·문장 · 독후감 · 퀴즈가 하나씩은 들어간다.
     상한을 넘겨 한 활동은 책갈피가 되고, 책갈피는 한 주에 주간책갈피(5)장까지 쌓인다(그 뒤는 기록만).
     책갈피 책갈피당도장(5)장은 만능 도장 1개가 된다. 만능은 개수 제한이 없고, 그 주 다섯 칸이 차 있으면 다음 주로 넘어간다.
     도장은 달이 바뀌어도 이어져 쌓이고 별당도장(5)개마다 별 1개 */
  function stampCaps(c){c=c||conf();
    function n(k,d){var v=Number(c[k]);return v>0?v:d;}
    return {week:Number(c["주간도장"])||5,month:Number(c["월간도장"])||1e9,
      gift:Number(c["상품권기준"])||5,types:S(c["상품권세종류"])!=="N",leaf:Number(c["책갈피당도장"])||5,
      leafWeek:n("주간책갈피",Number(c["책갈피당도장"])||5),
      kind:{write:n("주간라벨문장",1),review:n("주간독후감",2),quiz:n("주간퀴즈",2)}};}
  var STAMPS=null;
  /* 도장 종류 */
  var SLOTS=["write","review","quiz","wild"];
  /* 활동 → 도장 종류 */
  function slotOf(k){
    return (k==="review"||k==="theme")?"review":(k==="quizmk"||k==="quizsv"||k==="quiz")?"quiz":
           (k==="mission"||k==="wild"||k==="teacher"||k==="welcome"||k==="award")?"wild":"write";
  }
  /* 옛 이름(상품권 종류 조건에서 쓴다): 라벨·독후감·퀴즈 */
  function kindOf(k){var s=slotOf(k);return s==="write"?"label":s;}
  function stampMap(){
    if(STAMPS)return STAMPS;
    var A={};
    function put(hb,o){if(hb)(A[hb]=A[hb]||[]).push(o);}
    var bArea={},bMon={};
    db.rows("도서").forEach(function(b){
      var k=norm(shownTitle(b["제목"]));if(!bArea[k])bArea[k]=S(b["영역"]);
      if(S(b["숨김"])!=="Y"&&S(b["월"]))(bMon[k]=bMon[k]||{})[S(b["월"])]=true;
    });
    var perConf=conf()["추천묶음"],cmRule=comicRule(),cmBook={};
    db.rows("도서").forEach(function(b){if(S(b["만화"]))cmBook[S(b["id"])]=S(b["만화"]);});
    db.rows("글").forEach(function(r){
      if(!posted(r))return;
      var kind=writeKind(r["종류"]);
      /* 만화 독후감은 라벨·문장 자리로. 선생님이 나중에 책을 만화로 바꿔도 그때부터 반영된다 */
      if(kind==="review"&&cmRule!=="허용"&&(S(r["만화"])==="Y"||cmBook[S(r["도서id"])]==="Y"))kind="label";
      put(S(r["학번"]),{k:kind,t:S(r["책제목"]),at:S(r["시각"])});
      /* 덤 책갈피: 그달 추천 도서이거나 이 주의 주제에 맞는 독후감(겹쳐도 한 장) */
      if(kind==="review"){
        var key=norm(shownTitle(r["책제목"])),at=S(r["시각"]);
        var th=themeOf(weekOfYmd(at)),onTheme=!!(th&&(!th.area||th.area===bArea[key]));
        var pk="";try{pk=periodOf(S(at).slice(0,7),perConf).key;}catch(e){pk=S(at).slice(0,7);}
        var onShelf=!!(bMon[key]&&(bMon[key][pk]||bMon[key][S(at).slice(0,7)]));
        if(onTheme||onShelf)put(S(r["학번"]),{k:"theme",free:true,src:at,t:S(r["책제목"])+" · "+(onShelf?"추천 도서":"이 주의 주제"),at:at+"1"});
      }});
    /* 미션 이벤트: 목표를 채운 순간에 보상(첫 개는 만능 자리, 나머지는 책갈피) */
    try{
      var clsMap={};db.rows("명단").forEach(function(r){clsMap[S(r["학번"])]=S(r["반"]);});
      evOf("미션").forEach(function(e){
        Object.keys(clsMap).forEach(function(hb){
          var cls=clsMap[hb];if(!evHits(e,cls,""))return;
          var at=evMissionAt(e,hb,cls);if(!at)return;
          for(var i=0;i<Math.max(1,e.prize);i++)put(hb,{k:"mission",free:i>0,src:i?at+"~m0":"",t:"미션 · "+e.name,at:at+"~m"+i});
        });
      });
    }catch(e0){}
    /* 이달의 라벨·문장 시상: 만능 도장 하나(독후감은 별 1개라 여기 오지 않는다) */
    try{
      var aw=awardList();
      Object.keys(aw).forEach(function(hb){
        aw[hb].forEach(function(x){
          if(!x.wild)return;
          put(hb,{k:"award",t:"이달의 "+kName(x.kind)+" "+monLabel(x.mon)+" "+x.rank+"위 · 표 "+x.votes,at:x.at});
        });
      });
    }catch(e5){}
    /* 학급 전원 가입: 마지막 한 사람이 PIN 을 정한 그때, 그 반 모두에게 만능 도장 하나 */
    try{
      var cl={};
      db.rows("명단").forEach(function(r){
        var cls=S(r["반"]);if(!cls||cls===TEACHER_CLS||!S(r["학번"]))return;
        var o=cl[cls]||(cl[cls]={n:0,pin:0,at:"",list:[]});
        o.n++;o.list.push(S(r["학번"]));
        if(S(r["핀"])){o.pin++;var t=S(r["핀설정"]);if(t>o.at)o.at=t;}
      });
      Object.keys(cl).forEach(function(cls){
        var o=cl[cls];
        if(o.n<2||o.pin<o.n||!o.at)return;                 /* 한 사람이라도 아직이면 없음 */
        o.list.forEach(function(hb){
          put(hb,{k:"welcome",t:"우리 반 모두 가입 · "+cls,at:o.at+"~z"});});
      });
    }catch(e4){}
    /* 선생님이 손으로 찍어 준 도장: 자리를 차지하지 않는 만능 도장 */
    try{
      db.rows("도장").forEach(function(r){
        if(S(r["취소"])==="Y")return;
        put(S(r["학번"]),{k:"teacher",free:true,t:S(r["사유"])+" · "+S(r["교사"])+" 선생님",at:S(r["시각"])});
      });
    }catch(e3){}
    var wkNow=weekKey(env.now(),0),qBar=Number(conf()["퀴즈품질기준"])||6;
    db.rows("퀴즈").forEach(function(q){
      var hb=S(q["학번"]);if(!hb||S(q["출처"])==="자동")return;
      if(S(q["상태"])==="반려"||S(q["상태"])==="중복")return;
      /* ① 성의껏 낸 문제(품질 기준 이상)는 낸 그 자리에서 도장 하나 */
      if((Number(q["품질"])||0)>=qBar){put(hb,{k:"quizmk",t:"문제 내기 · "+S(q["책제목"]),at:S(q["시각"])});return;}
      /* ② 기준에 못 미쳐도 북퀴즈에 뽑히면 도장 */
      if(S(q["상태"])==="출제"&&S(q["주"])&&S(q["주"])<=wkNow)put(hb,{k:"quizmk",t:"퀴즈 출제 · "+S(q["책제목"]),at:S(q["주"])+" 00:00:01"});});
    db.rows("퀴즈응답").forEach(function(r){
      var n=Number(r["문항수"])||0,sc=Number(r["점수"])||0;
      if(n?sc*2>=n:sc>=1)put(S(r["학번"]),{k:"quizsv",t:"북퀴즈 "+S(r["주"]).slice(5).replace("-","/")+" 주",at:S(r["시각"])});});
    var caps=stampCaps(),out={};
    var clsOf={};db.rows("명단").forEach(function(r){clsOf[S(r["학번"])]=S(r["반"]);});
    var hasEv=evOf("배수").length>0;
    Object.keys(A).forEach(function(hb){
      var st=[],bo=[],over=[],pendW=[],cls=clsOf[hb]||"",capW={},mulW={},kn={},bused={},wn={},mo={},leaf=0,got=0,ok={};
      var raw=A[hb].sort(function(x,y){return x.at<y.at?-1:1;}),items=[];
      raw.forEach(function(x){
        var mul=hasEv?evMul(x.at,cls,kindOf(x.k)):1;
        items.push(x);
        for(var n2=1;n2<mul;n2++)items.push({k:x.k,free:true,src:x.at,t:x.t+" · 이벤트 ×"+mul,at:x.at+"~"+n2,ev:mul});
      });
      function mulOf(wk){if(mulW[wk]===undefined)mulW[wk]=hasEv?evWeekMul(wk,cls):1;return mulW[wk];}
      function capOf(wk){if(capW[wk]===undefined)capW[wk]=caps.week*mulOf(wk);return capW[wk];}
      /* 그 주에 한 칸이 더 들어가는지: 주 상한과 종류별 상한을 함께 본다(만능은 종류 상한이 없다) */
      function room(y,kind){
        if((mo[y.mon]||0)>=caps.month)return false;
        if((wn[y.wk]||0)>=capOf(y.wk))return false;
        if(kind==="wild")return true;
        return ((kn[y.wk]||{})[kind]||0)<(caps.kind[kind]||1)*mulOf(y.wk);
      }
      function place(y,kind){
        y.slot=kind;wn[y.wk]=(wn[y.wk]||0)+1;mo[y.mon]=(mo[y.mon]||0)+1;
        (kn[y.wk]=kn[y.wk]||{})[kind]=((kn[y.wk]||{})[kind]||0)+1;
        ok[y.at]=true;st.push(y);
      }
      /* 못 찍은 만능 도장은 다음 주로 넘어간다(그 주 칸이 날 때까지) */
      function flushW(wk,mon){
        var n=0;
        while(pendW.length){
          var w=pendW[0],y={k:w.k,t:w.t,at:wk+" 00:00:"+p2(Math.min(59,++n)),wk:wk,mon:mon};
          if(!room(y,"wild"))return;
          pendW.shift();place(y,"wild");
        }
      }
      /* 책갈피가 책갈피당도장(5)장 모이면 만능 도장 하나. 개수 제한은 없고, 칸이 없으면 다음 주로 */
      function cash(wk,mon,at){
        var n=0;
        while(leaf>=caps.leaf){
          leaf-=caps.leaf;
          var y={k:"wild",t:"만능 도장 · 책갈피 "+caps.leaf+"장",at:at+"~w"+(n++),wk:wk,mon:mon};
          if(room(y,"wild"))place(y,"wild");
          else pendW.push({k:y.k,t:y.t});
        }
      }
      items.forEach(function(x){
        var y={k:x.k,t:x.t,at:x.at,wk:weekOfYmd(x.at),mon:S(x.at).slice(0,7)},kind=slotOf(y.k);
        if(x.ev)y.ev=x.ev;
        /* 덤(주제·이벤트 배수)은 그 활동이 도장이 됐을 때만 따라온다 */
        if(x.src&&!ok[x.src]){y.over=true;y.slot=kind;over.push(y);return;}
        flushW(y.wk,y.mon);                          /* 지난주에서 넘어온 만능 도장부터 */
        cash(y.wk,y.mon,y.at);                       /* 그 다음이 책갈피 */
        if(kind==="wild"){                           /* 선생님 도장·이달의 상: 칸이 없으면 다음 주로 */
          if(room(y,"wild"))place(y,"wild");else pendW.push({k:y.k,t:y.t});
          return;
        }
        if(room(y,kind))place(y,kind);
        else{
          if((bused[y.wk]||0)<caps.leafWeek){        /* 책갈피는 한 주 모두 합쳐 주간책갈피(5)장까지 */
            bused[y.wk]=(bused[y.wk]||0)+1;
            y.bonus=true;y.slot=kind;y.why="week";bo.push(y);leaf++;got++;
            cash(y.wk,y.mon,y.at);
          }
          else{y.over=true;y.slot=kind;over.push(y);}
        }
      });
      flushW(weekKey(env.now(),0),monthKey(env.now()));
      cash(weekKey(env.now(),0),monthKey(env.now()),stamp(env.now()));
      flushW(weekKey(env.now(),0),monthKey(env.now()));
      out[hb]={stamps:st,bonus:bo,over:over,wait:pendW.length,
        leaf:{have:leaf,got:got,used:got-leaf,per:caps.leaf,toNext:caps.leaf-(leaf%caps.leaf)}};
    });
    return STAMPS=out;
  }
  /* 한 학생의 한 달: 도장 수, 종류, 상품권 대상 여부와 대상이 된 시각 */
  /* 종류 조건은 책갈피가 된 활동까지 본다 */
  function monthOf(hb,mon){
    var caps=stampCaps(),sm=stampMap()[hb]||{stamps:[],bonus:[]},has={},at="",n=0;
    sm.stamps.concat(sm.bonus).filter(function(x){return x.mon===mon;}).sort(function(x,y){return x.at<y.at?-1:1;}).forEach(function(x){
      if(!x.bonus)n++;
      var kk=kindOf(x.k);
      if(kk==="wild"){has.label=true;has.review=true;has.quiz=true;}else has[kk]=true;
      if(!at&&n>=caps.gift&&(!caps.types||(has.label&&has.review&&has.quiz)))at=x.at;});
    return {mon:mon,count:n,types:has,eligible:!!at,at:at,bonus:sm.bonus.filter(function(x){return x.mon===mon;}).length};
  }
  /* ── 별과 상품권 ──
     도장(한 주 최대 주간도장)은 누적으로 쌓이고, 별당도장(5)개마다 별 1개.
     수령 기간(설정 상품권배부, 비우면 매달 첫 월~목)마다 지금 가진 별로 상품권: 별 상품권당별(2)개에 1매, 한 번에 월최대매수(3)매까지.
     별은 상품권으로 바꿀 때만 빠진다. 기간 안에 못 받아도 그대로 남아 다음 수령에 쓸 수 있고, 기간 중에 새로 생긴 별도 쓸 수 있다 */
  function giftRule(c){c=c||conf();return {per:Number(c["별당도장"])||5,pair:Number(c["상품권당별"])||2,max:Number(c["월최대매수"])||3,won:Number(c["상품권금액"])||5000};}
  function monLabel(m){var x=/^(\d{4})-(\d{2})/.exec(S(m));return x?Number(x[2])+"월":S(m);}
  function monthEnd(m){var x=/^(\d{4})-(\d{2})/.exec(S(m));return x?ymd(new Date(Date.UTC(Number(x[1]),Number(x[2]),0))):"";}

  var STARS=null,AWARDS=null;

  function awardTops(c){c=c||conf();

  function awardList(){

  /* 시상으로 받은 별의 시각들(이달의 독후감) */

  /* 별이 된 때(시각)들. 도장은 달이 바뀌어도 이어져 쌓이고, 다섯 개가 찰 때마다 별 하나 */
  function starTimes(hb){
    if(!STARS){STARS={};var per=giftRule().per,sm=stampMap();Object.keys(sm).forEach(function(k){
      var st=sm[k].stamps.slice().sort(function(x,y){return x.at<y.at?-1:1;}),t=[];

  /* 지금까지 상품권으로 바꾼 별 수(지급 시트에 남은 기록) */

  var PAIDW=null;

  /* 그 수령 기간에 받을 수 있는 매수. 이미 받았으면 그때 기록을 그대로 보여 준다 */
  function claimOf(hb,wins,i){
    var R=giftRule(),w=wins[i],p=paidInfo(w.from,hb);
    if(p.paid)return {from:w.from,to:w.to,label:winLabel(w),stars:p.stars||p.n*R.pair,vouchers:p.n,paid:true,paidN:p.n,who:p.who,at:p.at};

  /* 지금 가진 별 = 쌓인 별 − 상품권으로 바꾼 별 */

  /* 도장과 별은 쭉 쌓인다. 별은 상품권으로 바꿀 때만 빠진다 */
  function starState(hb,c){
    c=c||conf();var wins=recvWindows(c),t=today(env.now()),all=starTimes(hb),R=giftRule(c),li=-1;

    var sm=stampMap()[hb]||{stamps:[],leaf:{have:0,per:R.per}},mon=monthKey(env.now()),have=starsNow(hb);

  /* 지난 수령 기록(별 2개 이상이었던 기간) */
  function monthStats(hb){

    stars.forEach(function(t){var m=t.slice(0,7);(by[m]=by[m]||{mon:m,stamps:0,stars:0,bonus:0}).stars++;});

  /* 지난 수령 기록(받은 것만. 못 받은 기간이 있어도 별은 그대로 남는다) */

  /* 수령대상 시트: 지금·다가오는 수령 기간과 지난 두 번의 대상자를 관리자가 시트에서 보도록 통째로 다시 쓴다 */
  function syncRecvSheet(){

  /* 학생에게 보일 상품권 배부 안내(상품권공개 Y 이고 배부 기간 7일 전부터 끝날 때까지) */
  function giftNoticeFor(a,c){

  /* ── 글 자동 점검(규칙 기반, 글은 학교 밖으로 나가지 않는다) ──
     ① 다른 사람 글과 많이 겹침  ② 책 소개글을 옮겨 적음  ③ 내 지난 글을 되풀이함  ④ 거친 말 */
  var BADW=["시발","씨발","존나","좆","병신","지랄","개새","닥쳐","꺼져","죽어라","등신","멍청이"];
  function shing(t){
    var x=S(t).replace(/\s+/g,"").toLowerCase(),set={},n=0;
    for(var i=0;i+3<=x.length;i++){if(!set[x.substr(i,3)]){set[x.substr(i,3)]=1;n++;}}
    return {set:set,n:n};
  }
  function simOf(a,b){
    if(!a.n||!b.n)return 0;
    var hit=0;Object.keys(a.set).forEach(function(k){if(b.set[k])hit++;});
    return hit/Math.min(a.n,b.n);      /* 짧은 쪽 기준(옮겨 적기를 잡기 쉽게) */
  }
  /* 새 글만 훑는다(같은 책 글·그 학생의 지난 글·책 소개글과만 견줘서 빠르게) */
  function checkPosts(rows,targets){
    var out={},blurb={},byBook={},byStu={},bad=BADW.concat(S(conf()["금칙어"]).split(/[,\n]+/).map(S).filter(Boolean));
    db.rows("도서").forEach(function(b){var k=norm(shownTitle(b["제목"])),t=S(b["소개"]);if(t&&t!=="-"&&!blurb[k])blurb[k]=shing(t);});
    rows.forEach(function(r){
      var o={id:S(r["id"]),hb:S(r["학번"]),bk:norm(shownTitle(r["책제목"])),kind:S(r["종류"]),txt:S(r["본문"])};
      (byBook[o.bk]=byBook[o.bk]||[]).push(o);
      if(o.hb)(byStu[o.hb]=byStu[o.hb]||[]).push(o);
    });
    (targets||rows).slice(0,120).forEach(function(r){
      var id=S(r["id"]),me={hb:S(r["학번"]),bk:norm(shownTitle(r["책제목"])),kind:S(r["종류"]),txt:S(r["본문"])};
      var g=shing(me.txt),why=[],top=0;
      function cmp(list,label,cap){
        (list||[]).slice(0,cap).forEach(function(y){
          if(y.id===id||y.kind!==me.kind)return;
          var v=simOf(g,shing(y.txt));if(v<0.55)return;
          top=Math.max(top,v);if(why.indexOf(label)<0)why.push(label);
        });
      }
      cmp(byBook[me.bk],"다른 학생 글과 겹침",40);
      cmp(byStu[me.hb],"내 지난 글과 겹침",20);
      var bl=blurb[me.bk];
      if(bl){var v2=simOf(g,bl);if(v2>=0.4){why.push("책 소개글과 겹침");top=Math.max(top,v2);}}
      var hit=bad.filter(function(w){return w&&me.txt.indexOf(w)>=0;});
      if(hit.length)why.push("거친 말: "+hit.slice(0,3).join(", "));
      if(why.length)out[id]={why:why,sim:Math.round(top*100)};
    });
    return out;
  }
  /* 건의함: 학생이 남긴 한마디와 관리자 답변. 이름은 관리자만 본다 */

  /* ── 이벤트 ──
     '이벤트' 시트 한 줄이 이벤트 하나입니다. 방식에 따라 값·보상의 뜻이 다릅니다.
       배수 : 값=도장 배수(2~5)            · 기간 안 활동의 도장을 값배로. 그 주 상한도 값배
       추첨 : 값=뽑을 인원 · 보상=상품권 매수 · 기간 안 활동 한 건이 추첨권 한 장
       대항 : 값=시상할 반 수               · 기간 안 반별 참여율 순위
       미션 : 값=목표 건수 · 보상=도장 수    · 기간 안에 목표를 채우면 도장을 그만큼 더
     대상: 비우면 전교생, "1학년"·"3-2"·"1,2학년". 종류: 비우면 전부, label·review·quiz */
  var EV_KINDS=["배수","추첨","대항","미션"];
  function evAll(){
    return db.rows("이벤트").filter(function(r){return S(r["숨김"]).toUpperCase()!=="Y"&&S(r["이름"])&&S(r["시작"])&&S(r["끝"]);})
      .map(function(r){

          val:Number(r["값"]||r["배수"])||(way==="배수"?2:way==="추첨"?10:way==="대항"?3:3),
          prize:Number(r["보상"])||(way==="추첨"?1:way==="미션"?2:0),
          target:S(r["대상"]),kind:S(r["종류"]),memo:S(r["메모"]),won:S(r["당첨"]),log:S(r["기록"])};

  function evHits(e,cls,kind){
    var tg=S(e.target).replace(/\s/g,"");
    if(tg){
      var ok=tg.split(/[,·]/).filter(Boolean).some(function(t){
        t=t.replace("학년","");
        if(/^\d$/.test(t))return S(cls).indexOf(t+"-")===0;
        return S(cls)===t;
      });
      if(!ok)return false;
    }
    var kd=S(e.kind).replace(/\s/g,"");
    if(kd&&kind){
      var k2=kind==="theme"?"review":kind;
      if(kd.split(/[,·]/).filter(Boolean).indexOf(k2)<0)return false;
    }
    return true;
  }
  function evLive(e,d){d=d||today(env.now());return d>=e.from&&d<=e.to;}
  function evOf(way){return evAll().filter(function(e){return e.way===way;});}
  /* 도장 배수 */
  function evMul(at,cls,kind){

    evOf("배수").forEach(function(e){if(d<e.from||d>e.to)return;if(!evHits(e,cls,kind))return;m=Math.max(m,Math.min(5,Math.max(2,e.val)));});

  /* 기간 안에 이 학생이 한 활동 수(종류 제한이 있으면 그 종류만) */
  function evDeeds(e,hb,cls){

      var d=S(r["시각"]).slice(0,10);if(d<e.from||d>e.to)return;

      db.rows("퀴즈응답").forEach(function(r){
        if(S(r["학번"])!==hb)return;var d=S(r["시각"]).slice(0,10);if(d<e.from||d>e.to)return;

  /* 미션: 목표를 채운 순간(그 학생의 그 이벤트) — 채웠으면 보상 도장을 그때 찍는다 */
  function evMissionAt(e,hb,cls){

      var at=S(r["시각"]);if(at.slice(0,10)<e.from||at.slice(0,10)>e.to)return;

      db.rows("퀴즈응답").forEach(function(r){

  /* 반 대항: 기간 안에 한 편이라도 낸 사람 비율 */
  function evClassRank(e){

      var cls=S(r["반"]);if(!cls)return;

    db.rows("글").forEach(function(r){

      return {cls:x.cls,total:x.total,joined:x.joined,posts:x.posts,pct:x.total?Math.round(x.joined/x.total*100):0};})
      .sort(function(a2,b2){return b2.pct-a2.pct||b2.posts-a2.posts||(a2.cls<b2.cls?-1:1);});

  /* 학생 화면에 보여 줄 이벤트(진행 중인 것) */
  function evForStudent(hb,cls){
    var out=[],d=today(env.now());

      if(e.way==="대항"){var rk=evClassRank(e),me=-1;rk.forEach(function(x,i){if(x.cls===cls)me=i;});
        o.rank=me>=0?me+1:0;o.of=rk.length;o.pct=me>=0?rk[me].pct:0;o.top=rk.slice(0,Math.max(1,e.val)).map(function(x){return x.cls;});}
      if(e.way==="배수")o.mul=Math.min(5,Math.max(2,e.val));

  /* 이 주의 주제: '주제' 시트에서 그 주(월요일 날짜) 한 줄. 주제 책 독후감에는 덤 도장이 하나 붙는다 */

  function previewState(a,as){
    var c=conf(),r=null;
    if(as!=="blank"){
      r=db.rows("명단").filter(function(x){return S(x["학번"])===S(as);})[0];
      if(!r)fail("명단에 없는 학번입니다.");
      if(!seeCls(a,S(r["반"])))fail("우리 학년 학생만 볼 수 있습니다.");
    }
    var who_=r?{role:"student",id:S(r["학번"]),name:S(r["이름"]),cls:S(r["반"])}
              :{role:"student",id:"__preview__",name:"미리보기 학생",cls:"미리보기"};
    var st=studentState(who_);
    st.preview={teacher:a.name,as:r?S(r["학번"]):"",admin:a.role==="admin"};
    return st;
  }

  function api(name,p){
    p=p||{};
    if(name==="login")return login(p);
    if(name==="logout")return logout(p);
    var a=who(p);
    if(a.role==="nologin"){
      if(name==="state")return {need:"login",conf:pubConf(conf())};
      fail("LOGIN");
    }
    if(a.role==="guest"&&pinMode()){
      if(name==="state")return {need:"login",conf:pubConf(conf())};
      fail("LOGIN");
    }
    if(a.role==="guest"){
      if(name==="state")return {need:"register",email:a.email,conf:pubConf(conf())};
      if(name==="register")return register(a,p);
      fail("먼저 학번과 이름을 등록해 주세요.");
    }
    /* 교사가 명단에 이메일을 미리 넣어 둔 학생도 처음 한 번은 동의를 받는다 */
    if(a.role==="student"&&!a.agreed){
      if(name==="state")return {need:"consent",email:a.email,name:a.name,conf:pubConf(conf())};
      if(name==="consent"){
        if(p.agree!==true)fail("동의해야 참여할 수 있습니다.");
        db.set("명단","학번",a.id,{"동의":stamp(env.now())});return {ok:true};
      }
      fail("먼저 개인정보 수집·이용에 동의해 주세요.");
    }
    if(name==="libSearch")return libSearch(a,p);
    if(name==="state"){
      if(p.as&&a.role!=="student")return previewState(a,S(p.as));
      return a.role==="student"?studentState(a):teacherState(a);
    }
    if(name==="submit")return submit(a,p);
    if(name==="vote")return vote(a,p);
    if(name==="like")return like(a,p);
    if(name==="staffLabel")return staffLabel(a,p);
    if(name==="quizAnswer")return quizAnswer(a,p);
    if(name==="quizSubmit")return quizSubmit(a,p);
    if(OPS[name])return OPS[name](a,p)||{ok:true};
    fail("알 수 없는 요청입니다.");
  }
